<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#16302f" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tornado Time!" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <title>Tornado Time!</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    #ta { position: fixed; inset: 0; pointer-events: none; }
    .poiArrow { position: fixed; left: 0; top: 0; width: 34px; height: 34px; pointer-events: none; display: none; z-index: 4; opacity: .42; }
    .poiArrow em { filter: grayscale(1); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 17px; border-radius: 50%; background: #0b1416c0; border: 2px solid #ffffff55; }
    .poiArrow i { position: absolute; inset: -13px; display: flex; align-items: center; justify-content: flex-end; font-style: normal; font-size: 13px; color: #fff; text-shadow: 0 0 3px #000; }
    .poiArrow.ready { opacity: 1; } .poiArrow.ready em { filter: none; border-color: #ffd24a; box-shadow: 0 0 10px #ffd24a; } .poiArrow.ready i { color: #ffd24a; }
    #taPct { position: absolute; left: 10px; bottom: calc(146px + env(safe-area-inset-bottom, 0)); width: 128px; box-sizing: border-box; text-align: center; padding: 3px 7px; border-radius: 9px; background: #0b1416c4; border: 2px solid #ffffff55; font-size: 12px; font-weight: 900; white-space: nowrap; color: #fff; } #taPct.ok { color: #7dff3a; border-color: #7dff3a; }
    #taMap { position: absolute; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0)); width: 128px; height: 128px; border-radius: 50%; background: #0b1416c0; border: 2px solid #ffffff55; pointer-events: auto; touch-action: none; }
    /* pause: big, bright green with purple bars, so nobody has to hunt for it */
    #taPause { position: absolute; right: 10px; top: calc(48px + env(safe-area-inset-top, 0)); pointer-events: auto; width: 46px; height: 46px; box-sizing: border-box; padding: 0; margin: 0; border-radius: 12px; background: #7dff3a; border: 3px solid #5a2f80; color: #5a2f80; font-size: 20px; font-weight: 900; line-height: 1; box-shadow: 0 0 12px #7dff3a99, 0 4px 0 #3a1a5a; }
    #taPause:active { transform: translateY(2px); box-shadow: 0 0 8px #7dff3a99, 0 2px 0 #3a1a5a; }
    #taStick { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: #ffffff1a; border: 2px solid #ffffff55; transform: translate(-50%, -50%); display: none; }
    #taKnob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%; background: #c9a6ffcc; transform: translate(-50%, -50%); }
    #taBanner { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 124px); text-align: center; line-height: 1.05; font-size: clamp(20px, 6vw, 40px); font-weight: 900; color: #ffd24a; text-shadow: 0 3px 0 #5a2f80, 0 6px 14px #000; white-space: normal; text-wrap: balance; opacity: 0; transition: opacity .2s; }
    .pop { position: fixed; left: 0; top: 0; font-weight: 900; font-size: 15px; color: #ffe27a; text-shadow: 0 2px 4px #000; pointer-events: none; white-space: nowrap; }
    #taStart .poi { font-size: 14px; max-width: 360px; }
    #taLevels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: min(92vw, 420px); }
    #taLevels .lvl { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 1px; font-size: 9px; min-width: 0; min-height: 58px; border-radius: 10px; }
    #taLevels .lvl b { font-size: 18px; } #taLevels .lvl i { font-style: normal; color: #1f4a12; font-weight: 800; font-size: 10px; }
    #taLevels .lvl.on { outline: 3px solid #7dff3a; } #taLevels .lvl:disabled { opacity: .45; }
    /* the button column on the right: pause, zoom in, zoom out, skip song. All one size, one edge, evenly spaced */
    .zoomBtn, #ta .skipHud { position: absolute; right: 10px !important; width: 46px !important; height: 46px !important; box-sizing: border-box; padding: 0; margin: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; line-height: 1; pointer-events: auto; border: 3px solid #5a2f80 !important; color: #5a2f80 !important; background-image: none !important; }
    .zoomBtn { background-color: #ffd24a !important; font-size: 28px; font-family: Arial, sans-serif; box-shadow: 0 0 10px #ffd24a88, 0 4px 0 #3a1a5a !important; } .zoomBtn:active { transform: translateY(2px); }
    #ta .skipHud { background-color: #7dff3a !important; font-size: 18px !important; box-shadow: 0 0 12px #7dff3a99, 0 4px 0 #3a1a5a !important; top: calc(210px + env(safe-area-inset-top, 0px)) !important; }
    /* the buttons sit in a row along the bottom, beside the mini map, which leaves the whole top for the targets bar */
    #taPause { left: 148px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; top: auto !important; right: auto !important; } #taZoomIn { left: 202px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; top: auto !important; right: auto !important; } #taZoomOut { left: 256px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; top: auto !important; right: auto !important; } #ta .skipHud { left: 310px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; top: auto !important; right: auto !important; }
    #hudGoal { max-width: min(560px, 100%) !important; } #taSub { margin-right: 0 !important; } #taPois { --cw: min(29px, calc((min(560px, 100vw - 20px) - 100px - (var(--n) - 1) * 5px) / var(--n))) !important; }
    .chaserArrow { color: #fff; font-size: 24px; }
    .photoBar { position: fixed; left: 0; top: 0; width: 64px; height: 8px; border-radius: 4px; background: #000a; border: 1px solid #fff8; overflow: hidden; display: none; pointer-events: none; z-index: 4; } .photoBar i { display: block; height: 100%; width: 0; background: #ffffff; }
    /* the tutorial prompt: a slim strip under the score bar, so the town stays in view */
    .howRow { display: flex; gap: 8px; justify-content: center; } .howRow button { margin: 0; }
    #taView { display: none !important; } /* the chase view is hidden for now */
    #taViewOld { position: absolute; right: 52px; top: calc(54px + env(safe-area-inset-top, 0)); pointer-events: auto; font-size: 11px; padding: 4px 8px; height: 26px; }
    .planeArrow { position: fixed; left: 0; top: 0; font-size: 26px; color: #9fd6ff; text-shadow: 0 0 8px #000, 0 0 3px #2a6aa0; pointer-events: none; display: none; z-index: 4; }
    .foeArrow { font-size: 24px; filter: drop-shadow(0 0 4px currentColor); }
    body.paused .foeTag, body.paused .planeArrow, body.paused .poiArrow, body.paused .pop, body.paused .photoBar, body.paused #taFoe { visibility: hidden; }
    .foeTag { position: fixed; left: 0; top: 0; padding: 3px 8px; border-radius: 9px; background: #120a1edd; border: 2px solid #ffffff66; color: #fff; font-weight: 900; font-size: 12px; letter-spacing: .3px; white-space: nowrap; pointer-events: none; display: none; z-index: 4; text-shadow: 0 1px 2px #000; }
    .foeTag.eat { border-color: #7dff3a; color: #c8ff9a; } .foeTag.run { border-color: #ff5a4a; color: #ffb4a8; } .foeTag.even { border-color: #ffd24a; color: #ffe9a0; } .foeTag.shield { border-color: #6affd8; color: #c8fff0; }
    .foeTag.hit { border-color: #ffd24a; color: #fff2b0; background: #4a2a00dd; animation: foePulse .45s infinite; } @keyframes foePulse { 50% { box-shadow: 0 0 12px #ffd24a; } }
    #taFoe { position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); padding: 6px 12px; border-radius: 8px; background: #2a0a1ccc; border: 2px solid #ff9a5a; color: #ffe6d0; font-weight: 900; font-size: 15px; opacity: 0; transition: opacity .15s; pointer-events: none; }
    #taSeeded { position: absolute; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: #0a2a44cc; border: 2px solid #9fd6ff; color: #cfeaff; font-weight: 900; font-size: 15px; opacity: 0; transition: opacity .15s; }
    .bonusSkin { margin-top: 8px; padding: 8px 10px; border-radius: 10px; border: 2px solid #7dff3a; background: #0e2a0acc; color: #7dff3a; font-weight: 900; font-size: 15px; box-shadow: 0 0 14px #7dff3a66; } .bonusSkin small { color: #cfe8c8; font-weight: 700; font-size: 11px; }
    #taEnd .howRow { flex-wrap: wrap; } #taEnd { gap: 8px; padding: 12px 16px; } #taEnd h1 { font-size: clamp(32px, 9vw, 60px); } #taEnd p { font-size: 15px; margin: 0; } #taEnd .small { font-size: 13px; } #taEnd table { font-size: 14px; } #taEnd td { padding: 1px 8px; } #taEnd button { padding-top: 10px; padding-bottom: 10px; } #taEnd .howRow button { font-size: 14px; }
    #taEnd table { margin: 0 auto; font-size: 14px; border-collapse: collapse; } #taEnd td { padding: 1px 8px; text-align: left; } #taEnd td:last-child { text-align: right; font-weight: 800; }
  </style>
</head>
<body class="booting">
  <div id="boot"><h1>TORNADO<br>TIME!</h1><div class="bootSpin"><i></i><i></i><i></i><i></i></div><div class="bootBar"><b></b></div><p class="bootLbl">BUILDING THE TOWN</p><p id="bootTip"></p></div>
  <script>window.__bootTip = function () { var t = ["Tap a target's icon up top and the storm heads straight for it.","The gold badges floating over town are your big targets.","A bigger storm wrecks taller buildings. Start with the small stuff.","Tap a seeding plane to strike it down. It crashes and takes buildings with it.","If a storm chaser gets away with its photos, another plane joins the hunt.","Drag anywhere to steer. Tap a spot and lightning leads the way.","Wreck the power plant and the whole town goes dark.","A rogue twister smaller than you is lunch. A bigger one is trouble: strike it down to size.","Step off the orange line before the storm cannon fires.","The UFO drops its shield to beam people up. Strike it then."]; document.getElementById('bootTip').textContent = 'TIP: ' + t[Math.floor(Math.random() * t.length)]; }; window.__bootTip();</script>
  <canvas id="game"></canvas>
  <div id="ta" class="hidden">
    <div class="top">
      <div id="hudSize"><b id="taRank">F0</b><div id="taGrow"><div id="taGrowFill"></div><i class="tick" style="left:20%"><b>F1</b></i><i class="tick" style="left:40%"><b>F2</b></i><i class="tick" style="left:60%"><b>F3</b></i><i class="tick" style="left:80%"><b>F4</b></i><i class="tick" style="left:100%"><b>F5</b></i></div><span id="taTime">2:00</span></div>
      <div id="hudGoal"><span class="goalLbl">🎯 TARGETS<b id="taTargets"></b></span><div id="taPois"></div></div>
      <div id="taSub"><span id="taLevel"></span><span id="taScore">0</span><span id="taCombo"></span></div>
    </div>
    <canvas id="taMap"></canvas><div id="taPct"></div>
    <button id="taView" class="ghost">ISO</button>
    <button id="taZoomIn" class="ghost zoomBtn">+</button><button id="taZoomOut" class="ghost zoomBtn">−</button>
    <button id="taPause" aria-label="Pause">❚❚</button>
    <div id="taStick"><div id="taKnob"></div></div>
    <div id="taBanner"></div>
    <div id="taSeeded">SEEDED! SHRINKING</div>
    <div id="taFoe"></div>
  </div>

  <div id="taStart" class="screen">
    <h1>TORNADO<br>TIME!</h1>
    <p>You are the storm. Wreck the town!</p>
    <div id="twChosen" class="chosenCard"><canvas id="twChosenCv" width="150" height="150"></canvas><div><small>YOUR TORNADO</small><b id="twChosenName"></b><span id="twChosenDesc"></span><button id="twChoose" class="ghost">🌪️ CHOOSE TORNADO</button></div></div>
    <div id="taLevels"></div>
    <button id="taPlay">PLAY</button>
    <div class="howRow"><button id="taHow" class="ghost">HOW TO PLAY</button><button class="ghost menuBtn" onclick="location.href='menu.html'">MAIN MENU</button></div>
  </div>
  <div id="twPickScr" class="screen hidden pickScr"><h1>CHOOSE YOUR TORNADO</h1><p id="twPickInfo" class="pickInfo"></p><div id="twPick" class="pickGrid"></div><button id="twPickDone" class="pickDone">✔ DONE</button></div>
  <div id="taPaused" class="screen hidden"><h1>PAUSED</h1><button id="taResume">RESUME</button><button id="taRestart" class="ghost">↺ RESTART LEVEL</button><button class="ghost menuBtn" onclick="location.href='menu.html'">MAIN MENU</button></div>
  <div id="taPrize" class="screen hidden"><h1>PRIZE TIME!</h1><div id="taChests" class="chests"></div></div>
  <div id="taEnd" class="screen hidden">
    <h1 id="taEndTitle">STORM'S OVER</h1>
    <p class="small" id="taGoalLine"></p>
    <table id="taStats"></table>
    <button id="taAgain">GO AGAIN</button>
    <div class="howRow"><button class="ghost" onclick="location.href='store.html?from=alley'">🎨 SKIN SHOP</button><button class="ghost" onclick="location.href='tornado.html'">MENU</button><button class="ghost menuBtn" onclick="location.href='menu.html'">MAIN MENU</button></div>
  </div>
  <script type="module" src="./src/ally/main.js"></script>
</body>
</html>
