<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#16302f" />
  <title>Dead City: Tornado Alley</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    #ta { position: fixed; inset: 0; pointer-events: none; }
    #ta .top { position: absolute; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 6px 10px 0; text-shadow: 0 1px 3px #000; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-weight: 800; }
    #taScore { font-size: 22px; } #taCombo { color: #ffd24a; font-size: 16px; } #taTime { margin-left: auto; font-size: 18px; } #taRank { color: #7dff3a; font-size: 16px; }
    #taSub { width: 100%; display: flex; gap: 10px; font-size: 12px; font-weight: 700; opacity: .92; white-space: nowrap; } #taSub > span { white-space: nowrap; }
    #taPois { position: absolute; left: 10px; right: 52px; top: calc(86px + env(safe-area-inset-top, 0)); display: flex; flex-wrap: wrap; gap: 5px; }
    .poiChip { position: relative; width: 28px; height: 28px; border-radius: 8px; background: #0b1416c0; border: 2px solid #ffffff33; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .poiChip em { font-style: normal; opacity: .6; } .poiChip.ready em { opacity: 1; }
    .poiChip b { position: absolute; bottom: -6px; right: -6px; font-size: 8px; font-weight: 900; line-height: 11px; padding: 0 3px; border-radius: 5px; background: #5a2f80; color: #fff; }
    .poiChip.ready { border-color: #ffd24a; box-shadow: 0 0 8px #ffd24aaa; } .poiChip.ready b { background: #ffd24a; color: #1a0f2e; }
    .poiChip.done { background: #1d5a18; border-color: #7dff3a; box-shadow: 0 0 8px #7dff3a88; } .poiChip.done em { opacity: .6; filter: grayscale(1); } .poiChip.done b { display: none; }
    .poiChip.done::before { content: ''; position: absolute; left: 1px; right: 1px; top: 50%; height: 3px; background: #ff4a3a; transform: rotate(-35deg); box-shadow: 0 0 2px #000; }
    .poiChip.done::after { content: ''; position: absolute; right: -6px; bottom: -6px; width: 15px; height: 15px; border-radius: 50%; background: #7dff3a radial-gradient(circle, transparent 0, transparent 0); box-shadow: 0 0 0 2px #0b1416; }
    .poiChip.done i { position: absolute; right: -1px; bottom: -2px; width: 4px; height: 8px; border: solid #0b1416; border-width: 0 2px 2px 0; transform: rotate(40deg); z-index: 1; }
    .poiChip.boom { animation: poiBoom .8s ease-out; } @keyframes poiBoom { 0% { transform: scale(1); } 25% { transform: scale(1.9); box-shadow: 0 0 24px #7dff3a; } 100% { transform: scale(1); } }
    .poiArrow { position: fixed; left: 0; top: 0; width: 34px; height: 34px; pointer-events: none; display: none; z-index: 4; opacity: .55; }
    .poiArrow em { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 17px; border-radius: 50%; background: #0b1416c0; border: 2px solid #ffffff55; }
    .poiArrow i { position: absolute; inset: -13px; display: flex; align-items: center; justify-content: flex-end; font-style: normal; font-size: 13px; color: #fff; text-shadow: 0 0 3px #000; }
    .poiArrow.ready { opacity: 1; } .poiArrow.ready em { border-color: #ffd24a; box-shadow: 0 0 10px #ffd24a; } .poiArrow.ready i { color: #ffd24a; }
    #taMap { position: absolute; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0)); width: 104px; height: 104px; border-radius: 50%; background: #0b1416c0; border: 2px solid #ffffff55; pointer-events: auto; touch-action: none; }
    #taGrow { position: absolute; left: 10px; right: 104px; top: calc(62px + env(safe-area-inset-top, 0)); height: 7px; background: #ffffff22; border-radius: 3px; }
    #taGrowFill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #7dff3a, #ffd24a, #ff5a3a); }
    #taGrow .tick { position: absolute; top: -2px; width: 2px; height: 11px; background: #ffffffcc; transform: translateX(-1px); }
    #taGrow .tick b { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000; }
    #taGrow .tick.got b { color: #7dff3a; }
    #taPause { position: absolute; right: 10px; top: calc(54px + env(safe-area-inset-top, 0)); pointer-events: auto; font-size: 11px; padding: 4px 8px; height: 26px; }
    #taStick { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: #ffffff1a; border: 2px solid #ffffff55; transform: translate(-50%, -50%); display: none; }
    #taKnob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%; background: #c9a6ffcc; transform: translate(-50%, -50%); }
    #taBanner { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); font-size: clamp(22px, 7vw, 40px); font-weight: 900; color: #ffd24a; text-shadow: 0 3px 0 #5a2f80, 0 6px 14px #000; white-space: nowrap; opacity: 0; transition: opacity .2s; }
    .pop { position: fixed; left: 0; top: 0; font-weight: 900; font-size: 15px; color: #ffe27a; text-shadow: 0 2px 4px #000; pointer-events: none; white-space: nowrap; }
    #taStart .poi { font-size: 14px; max-width: 360px; }
    #taLevels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: min(92vw, 420px); }
    #taLevels .lvl { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; font-size: 10px; min-height: 58px; border-radius: 10px; }
    #taLevels .lvl b { font-size: 18px; } #taLevels .lvl i { font-style: normal; color: #ffd24a; font-size: 10px; }
    #taLevels .lvl.on { outline: 3px solid #7dff3a; } #taLevels .lvl:disabled { opacity: .45; }
    #taLevel { color: #c9a6ff; }
    .zoomBtn { position: absolute; right: 10px; width: 34px; height: 34px; padding: 0; font-size: 20px; line-height: 1; pointer-events: auto; }
    #taZoomIn { top: calc(90px + env(safe-area-inset-top, 0)); } #taZoomOut { top: calc(130px + env(safe-area-inset-top, 0)); }
    .chaserArrow { color: #fff; font-size: 24px; }
    .photoBar { position: fixed; left: 0; top: 0; width: 64px; height: 8px; border-radius: 4px; background: #000a; border: 1px solid #fff8; overflow: hidden; display: none; pointer-events: none; z-index: 4; } .photoBar i { display: block; height: 100%; width: 0; background: #ffffff; }
    #taTut { position: absolute; left: 50%; top: calc(126px + env(safe-area-inset-top, 0)); transform: translateX(-50%); width: min(360px, 92vw); padding: 10px 12px; border-radius: 14px; background: #1a0f2ef0; border: 2px solid #ffd24a; text-align: center; pointer-events: auto; box-shadow: 0 4px 16px #000a; transition: border-color .2s; }
    #taTut.hidden { display: none; } #taTut.ok { border-color: #7dff3a; } #taTut.ok b { color: #7dff3a; }
    #taTut b { display: block; font-size: 11px; letter-spacing: 1px; color: #ffd24a; } #taTut p { margin: 4px 0 6px; font-size: 15px; font-weight: 700; line-height: 1.3; color: #fff; }
    #taTut button { font-size: 11px; padding: 5px 10px; margin: 0; } #taTut button.hidden { display: none; }
    .howRow { display: flex; gap: 8px; justify-content: center; } .howRow button { margin: 0; }
    #taView { display: none !important; } /* the chase view is hidden for now */
    #taViewOld { position: absolute; right: 52px; top: calc(54px + env(safe-area-inset-top, 0)); pointer-events: auto; font-size: 11px; padding: 4px 8px; height: 26px; }
    .planeArrow { position: fixed; left: 0; top: 0; font-size: 26px; color: #9fd6ff; text-shadow: 0 0 8px #000, 0 0 3px #2a6aa0; pointer-events: none; display: none; z-index: 4; }
    #taSeeded { position: absolute; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: #0a2a44cc; border: 2px solid #9fd6ff; color: #cfeaff; font-weight: 900; font-size: 15px; opacity: 0; transition: opacity .15s; }
    .bonusSkin { margin-top: 8px; padding: 8px 10px; border-radius: 10px; border: 2px solid #7dff3a; background: #0e2a0acc; color: #7dff3a; font-weight: 900; font-size: 15px; box-shadow: 0 0 14px #7dff3a66; } .bonusSkin small { color: #cfe8c8; font-weight: 700; font-size: 11px; }
    #taEnd table { margin: 0 auto; font-size: 15px; border-collapse: collapse; } #taEnd td { padding: 2px 8px; text-align: left; } #taEnd td:last-child { text-align: right; font-weight: 800; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ta" class="hidden">
    <div class="top"><span id="taScore">0</span><span id="taCombo"></span><span id="taRank">F0</span><span id="taTime">2:00</span>
      <div id="taSub"><span id="taLevel"></span><span id="taPct">0% destroyed</span><span id="taPeople">0 people</span><span id="taTargets"></span></div></div>
    <div id="taPois"></div><canvas id="taMap"></canvas>
    <div id="taGrow"><div id="taGrowFill"></div><i class="tick" style="left:20%"><b>F1</b></i><i class="tick" style="left:40%"><b>F2</b></i><i class="tick" style="left:60%"><b>F3</b></i><i class="tick" style="left:80%"><b>F4</b></i><i class="tick" style="left:100%"><b>F5</b></i></div>
    <button id="taView" class="ghost">ISO</button>
    <button id="taZoomIn" class="ghost zoomBtn">+</button><button id="taZoomOut" class="ghost zoomBtn">−</button>
    <button id="taPause" class="ghost">❚❚</button>
    <div id="taStick"><div id="taKnob"></div></div>
    <div id="taBanner"></div>
    <div id="taTut" class="hidden"><b id="taTutStep"></b><p id="taTutText"></p><div><button id="taTutSkip" class="ghost">SKIP TUTORIAL</button><button id="taTutDone" class="hidden">PLAY THE GAME</button></div></div>
    <div id="taSeeded">SEEDED! SHRINKING</div>
  </div>

  <div id="taStart" class="screen">
    <p class="small" style="letter-spacing:4px;color:#c9a6ff;margin-bottom:-8px">DEAD CITY</p>
    <h1>TORNADO<br>ALLEY</h1>
    <p>You are the storm. Wreck the town!</p>
    <div id="taLevels"></div>
    <button id="taPlay">UNLEASH</button>
    <div class="howRow"><button id="taTutBtn" class="ghost">🎓 TUTORIAL</button><button id="taHow" class="ghost">HOW TO PLAY</button></div>
    <button class="ghost menuBtn" onclick="location.href='index.html'">MAIN MENU</button>
  </div>
  <div id="taPaused" class="screen hidden"><h1>PAUSED</h1><button id="taResume">RESUME</button><button class="ghost menuBtn" onclick="location.href='index.html'">MAIN MENU</button></div>
  <div id="taEnd" class="screen hidden">
    <h1 id="taEndTitle">STORM'S OVER</h1>
    <p class="small" id="taGoalLine"></p>
    <table id="taStats"></table>
    <div id="taChests" class="chests"></div>
    <button id="taAgain">GO AGAIN</button>
    <button class="ghost menuBtn" onclick="location.href='index.html'">MAIN MENU</button>
  </div>
  <script type="module" src="./src/ally/main.js"></script>
</body>
</html>
