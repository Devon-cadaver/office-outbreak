  <script>window.__bootTip = function () { var t = ["Tap a target's icon up top and the storm heads straight for it.","The gold badges floating over town are your big targets.","A bigger storm wrecks taller buildings. Start with the small stuff.","Tap a seeding plane to strike it down. It crashes and takes buildings with it.","If a storm chaser gets away with its photos, another plane joins the hunt.","Drag anywhere to steer. Tap a spot and lightning leads the way.","Wreck the power plant and the whole town goes dark.","A rogue twister smaller than you is lunch. A bigger one is trouble: strike it down to size.","Step off the orange line before the storm cannon fires.","The UFO drops its shield to beam people up. Strike it then."]; document.getElementById('bootTip').textContent = 'TIP: ' + t[Math.floor(Math.random() * t.length)]; }; window.__bootTip();</script>

<script>/* EXIT: leave full screen and go back to the title screen (a web page cannot close its own tab) */ window.exitGame = function () { var w = window; try { if (parent !== window && parent.document) w = parent; } catch (e) {} try { var d = w.document, x = d.exitFullscreen || d.webkitExitFullscreen; if ((d.fullscreenElement || d.webkitFullscreenElement) && x) x.call(d); if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} w.location.href = "index.html"; };</script>

      const r = el('div', 'rdr', '<div class="rscope"></div>'); r.id = 'sRadar'; $('twChosen').before(r); r.append(lv, play); play.classList.add('rgo');
