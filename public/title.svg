<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Dead City">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0f33"/><stop offset=".6" stop-color="#2a1449"/><stop offset="1" stop-color="#120a1f"/></linearGradient>
    <radialGradient id="moon"><stop offset="0" stop-color="#fff7d6"/><stop offset=".7" stop-color="#e8dcae"/><stop offset="1" stop-color="#e8dcae" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="zombie"><circle cx="0" cy="-20" r="6" fill="#7fd3b0"/><circle cx="-2" cy="-21" r="1.4" fill="#6cff2a"/><circle cx="2" cy="-21" r="1.4" fill="#6cff2a"/><rect x="-5" y="-14" width="10" height="13" rx="3" fill="#2f4f3a"/><rect x="-5" y="-1" width="4" height="9" fill="#2a3a30"/><rect x="1" y="-1" width="4" height="9" fill="#2a3a30"/><rect x="-11" y="-12" width="9" height="3" fill="#7fd3b0"/><rect x="2" y="-12" width="9" height="3" fill="#7fd3b0"/></g>
    <g id="hero"><circle cx="0" cy="-20" r="6" fill="#f0c9a6"/><rect x="-6" y="-27" width="12" height="5" rx="2" fill="#7a3fa8"/><rect x="-5" y="-14" width="10" height="13" rx="3" fill="#4f8fd6"/><rect x="-5" y="-1" width="4" height="9" fill="#3b3f55"/><rect x="1" y="-1" width="4" height="9" fill="#3b3f55"/></g>
    <g id="car"><rect x="-26" y="-14" width="52" height="12" rx="3" fill="#7a3f8a"/><rect x="-16" y="-24" width="30" height="11" rx="3" fill="#5a86a8"/><rect x="-14" y="-22" width="26" height="8" fill="#9ad0ff"/><circle cx="-16" cy="0" r="5" fill="#101416"/><circle cx="16" cy="0" r="5" fill="#101416"/><rect x="24" y="-10" width="4" height="3" fill="#ffe27a"/><circle cx="2" cy="-26" r="5" fill="#f0c9a6"/><rect x="-4" y="-33" width="12" height="5" rx="2" fill="#7a3fa8"/></g>
  </defs>
  <style>
    @keyframes runR { from { transform: translateX(-140px); } to { transform: translateX(560px); } }
    @keyframes runL { from { transform: translateX(560px); } to { transform: translateX(-180px); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes legs { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes flash { 0%,100% { opacity: 0; } 2% { opacity: 1; } 4% { opacity: .2; } 6% { opacity: .9; } 9% { opacity: 0; } }
    @keyframes sky { 0%,100% { opacity: 0; } 2%,6% { opacity: .35; } 9% { opacity: 0; } }
    @keyframes storm { 0%, 55% { transform: translateX(-460px); opacity: 0; } 58% { opacity: .55; } 75% { transform: translateX(460px); opacity: .55; } 78%,100% { transform: translateX(460px); opacity: 0; } }
    @keyframes sceneA { 0%,48% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes sceneB { 0%,49% { opacity: 0; } 51%,100% { opacity: 1; } }
    .wheel { transform-origin: 322px 150px; animation: spin 14s linear infinite; }
    .a { animation: sceneA 12s step-end infinite; }
    .b { animation: sceneB 12s step-end infinite; }
    .runR { animation: runR 6s linear infinite; }
    .runL { animation: runL 6s linear infinite; animation-delay: 6s; }
    .bob { animation: bob .36s ease-in-out infinite; }
    .leg { transform-origin: 0 -1px; animation: legs .36s ease-in-out infinite; }
    .bolt { animation: flash 12s linear infinite; }
    .bolt2 { animation: flash 12s linear infinite; animation-delay: 6.5s; }
    .skyflash { animation: sky 12s linear infinite; }
    .skyflash2 { animation: sky 12s linear infinite; animation-delay: 6.5s; }
    .sand { animation: storm 12s linear infinite; }
  </style>
  <rect width="420" height="300" rx="22" fill="url(#sky)"/>
  <rect class="skyflash" width="420" height="300" rx="22" fill="#bfe0ff"/>
  <rect class="skyflash2" width="420" height="300" rx="22" fill="#bfe0ff"/>
  <circle cx="78" cy="78" r="26" fill="url(#moon)"/>
  <g fill="#140b26">
    <rect x="20" y="130" width="26" height="120"/><rect x="50" y="108" width="34" height="142"/><rect x="88" y="138" width="22" height="112"/><rect x="114" y="118" width="40" height="132"/><rect x="158" y="146" width="30" height="104"/><rect x="192" y="124" width="36" height="126"/><rect x="232" y="150" width="26" height="100"/><rect x="262" y="132" width="34" height="118"/><rect x="380" y="140" width="26" height="110"/>
  </g>
  <g fill="#ffe27a" opacity=".8"><rect x="56" y="118" width="5" height="6"/><rect x="68" y="118" width="5" height="6"/><rect x="56" y="134" width="5" height="6"/><rect x="120" y="128" width="5" height="6"/><rect x="138" y="144" width="5" height="6"/><rect x="200" y="134" width="5" height="6"/><rect x="212" y="150" width="5" height="6"/><rect x="270" y="142" width="5" height="6"/><rect x="386" y="150" width="5" height="6"/></g>
  <!-- ferris wheel -->
  <g stroke="#c49bff" stroke-width="3" fill="none"><line x1="300" y1="250" x2="322" y2="150"/><line x1="344" y1="250" x2="322" y2="150"/></g>
  <g class="wheel" stroke="#c49bff" stroke-width="2.5" fill="none">
    <circle cx="322" cy="150" r="56"/><circle cx="322" cy="150" r="6" fill="#c49bff"/>
    <g stroke-width="1.6"><line x1="322" y1="94" x2="322" y2="206"/><line x1="266" y1="150" x2="378" y2="150"/><line x1="282" y1="110" x2="362" y2="190"/><line x1="362" y1="110" x2="282" y2="190"/></g>
    <g fill="#7dff3a" stroke="none"><rect x="316" y="88" width="12" height="9" rx="2"/><rect x="316" y="203" width="12" height="9" rx="2"/><rect x="260" y="145" width="12" height="9" rx="2"/><rect x="372" y="145" width="12" height="9" rx="2"/><rect x="276" y="104" width="12" height="9" rx="2" fill="#ff8a1a"/><rect x="356" y="184" width="12" height="9" rx="2" fill="#ff8a1a"/><rect x="356" y="104" width="12" height="9" rx="2" fill="#b05cff"/><rect x="276" y="184" width="12" height="9" rx="2" fill="#b05cff"/></g>
  </g>
  <!-- street -->
  <rect x="0" y="250" width="420" height="50" fill="#232e33"/><rect x="0" y="248" width="420" height="3" fill="#3a4c52"/>
  <g stroke="#e8c84a" stroke-width="2" stroke-dasharray="14 10"><line x1="0" y1="272" x2="420" y2="272"/><line x1="0" y1="277" x2="420" y2="277"/></g>
  <!-- lightning -->
  <g class="bolt" filter="url(#glow)" stroke="#fff" stroke-width="2.5" fill="none" stroke-linejoin="round"><polyline points="150,0 158,40 146,62 160,90 150,118 166,150 154,180 170,248"/><polyline points="160,90 176,104 170,122" stroke="#8ad0ff" stroke-width="1.5"/></g>
  <g class="bolt2" filter="url(#glow)" stroke="#fff" stroke-width="2.5" fill="none" stroke-linejoin="round"><polyline points="250,0 242,36 256,60 244,92 258,126 246,160 262,200 250,248"/><polyline points="244,92 230,110 236,128" stroke="#8ad0ff" stroke-width="1.5"/></g>
  <!-- scene A: zombies chase the survivor left to right -->
  <g class="a">
    <g class="runR"><g transform="translate(0,246)"><g class="bob"><use href="#hero"/></g></g>
      <g transform="translate(-28,246)"><g class="bob" style="animation-delay:.1s"><use href="#zombie"/></g></g>
      <g transform="translate(-50,246)"><g class="bob" style="animation-delay:.2s"><use href="#zombie"/></g></g>
      <g transform="translate(-74,246)"><g class="bob" style="animation-delay:.05s"><use href="#zombie"/></g></g>
      <g transform="translate(-96,246)"><g class="bob" style="animation-delay:.25s"><use href="#zombie"/></g></g>
      <g transform="translate(-122,246)"><g class="bob" style="animation-delay:.15s"><use href="#zombie"/></g></g>
    </g>
  </g>
  <!-- scene B: the survivor comes back in a car, zombies flee right to left -->
  <g class="b">
    <g class="runL"><g transform="translate(0,246)"><g class="bob" style="animation-delay:.1s"><use href="#zombie"/></g></g>
      <g transform="translate(24,246)"><g class="bob" style="animation-delay:.2s"><use href="#zombie"/></g></g>
      <g transform="translate(46,246)"><g class="bob"><use href="#zombie"/></g></g>
      <g transform="translate(70,246)"><g class="bob" style="animation-delay:.3s"><use href="#zombie"/></g></g>
      <g transform="translate(130,250) scale(-1,1)"><use href="#car"/></g>
    </g>
  </g>
  <!-- sandstorm sweep -->
  <rect class="sand" x="0" y="0" width="460" height="300" fill="#c9a35a"/>
  <!-- title -->
  <text x="210" y="46" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="800" font-size="16" letter-spacing="7" fill="#c9a6ff" stroke="#120a1f" stroke-width="3" paint-order="stroke">SURVIVE</text>
  <text x="210" y="96" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="900" font-size="54" letter-spacing="2" fill="#7dff3a" stroke="#120a1f" stroke-width="5" paint-order="stroke" filter="url(#glow)">DEAD CITY</text>
</svg>
