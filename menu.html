  <style>

    #load { position: fixed; left: 50%; top: 50%; z-index: 1; display: flex; gap: 10px; transform: translate(-50%, -50%); } #load i { width: 12px; height: 12px; border-radius: 50%; background: #7dff3a; animation: loadDot .8s ease-in-out infinite alternate; } #load i:nth-child(2) { animation-delay: .15s; } #load i:nth-child(3) { animation-delay: .3s; }

    body.title #logo { opacity: 1; transform: translateX(-50%); transition: transform .4s cubic-bezier(.2, 1.5, .4, 1), opacity .12s, top .45s, width .45s; }
    body.ready #logo { top: calc(4px + env(safe-area-inset-top, 0px)); width: var(--logoSmall); }
    #tap { position: fixed; left: 50%; bottom: calc(10vh + env(safe-area-inset-bottom, 0px)); z-index: 3; display: grid; justify-items: center; gap: 10px; pointer-events: none; opacity: 0; transform: translateX(-50%) scale(.6); font-family: system-ui, 'Segoe UI', sans-serif; }
    #tap b { font-weight: 900; font-size: clamp(22px, 6vw, 34px); letter-spacing: 2px; white-space: nowrap; padding: 16px 42px; border-radius: 16px; border: 3px solid #120a1f; background: #7dff3a; color: #120a1f; box-shadow: 0 6px 0 #3a8a1a, 0 0 30px #7dff3a88; animation: tapPulse .9s ease-in-out infinite alternate; }

    body.rdr #radar #quickBtn { width: 34%; height: 34%; background: #7dff3a; border: 3px solid #d8ffc0; box-shadow: 0 0 26px #7dff3a, 0 6px 0 #3f9a1f !important; animation: rdrPlay 1.2s ease-in-out infinite alternate; }
    @keyframes rdrPlay { to { box-shadow: 0 0 38px #7dff3a, 0 6px 0 #3f9a1f; } }
    body.rdr #radar #quickBtn b { font-size: clamp(18px, calc(var(--S) * 0.078), 30px) !important; letter-spacing: 1px; color: #120a1f !important; max-width: none; white-space: nowrap !important; }

      #radar { --S: min(calc(100vh - 84px), 50vw); margin: 0 0 40px; } .rbar { flex-direction: column; margin: 0; gap: 6px; } .rbar .rb button { width: 44px; height: 44px; } body.rdr #menu .credits { display: none; }
    }
    #menu { display: flex; background: transparent !important; justify-content: flex-start !important; padding-top: calc(var(--logoSmall) * 0.583 + 12px + env(safe-area-inset-top, 0px)); /* the buttons start below the logo */ padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); gap: 8px !important; z-index: 1; }
    #menu > * { opacity: 0; transform: translateY(24px) scale(.96); transition: opacity .35s, transform .45s cubic-bezier(.2, 1.4, .4, 1); }
    body.ready #menu > * { opacity: 1; transform: none; }
    body.ready #menu > :nth-child(1) { transition-delay: 0.07s; } body.ready #menu > :nth-child(2) { transition-delay: 0.14s; } body.ready #menu > :nth-child(3) { transition-delay: 0.21s; } body.ready #menu > :nth-child(4) { transition-delay: 0.28s; } body.ready #menu > :nth-child(5) { transition-delay: 0.35s; } body.ready #menu > :nth-child(6) { transition-delay: 0.42s; } body.ready #menu > :nth-child(7) { transition-delay: 0.49s; } body.ready #menu > :nth-child(8) { transition-delay: 0.56s; }
    .choice { padding: 9px 14px !important; gap: 1px !important; box-shadow: 0 4px 0 #3a1f5a !important; }
    .choice b { font-size: 17px !important; } .choice span { font-size: 11.5px !important; }
    /* QUICK PLAY is the one big button; under it the rest sit in pairs so a new player sees one obvious thing to press */
    .choice.quick { text-align: center; padding: 13px 14px !important; gap: 2px !important; border: 0; background-color: #7dff3a; color: #120a1f; box-shadow: 0 6px 0 #3f9a1f, 0 8px 12px #0007 !important; }
    .choice.quick b { font-size: 26px !important; letter-spacing: 2px; color: #120a1f; } .choice.quick span { font-size: 12px !important; font-weight: 700; opacity: .75; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(88vw, 360px); }
    .pair .choice { width: auto; min-width: 0; margin: 0; padding: 9px 10px !important; } .pair .choice b { font-size: 13.5px !important; letter-spacing: .3px; white-space: nowrap; } .pair .choice span { font-size: 10.5px !important; }
    #menu > .choice:not(.quick) { padding: 8px 14px !important; } #menu > .choice:not(.quick) b { font-size: 14px !important; } #menu > .choice:not(.quick) span { display: none; } /* SAVE CODE: one small line */
    /* the two big ways in, under QUICK PLAY: Tornado Time! itself, and the bonus games' own screen */
    /* the paired buttons: a big icon on the left, the words beside it */
    .pair .choice { display: grid !important; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left !important; } .pair .choice i.ic { grid-row: 1 / 3; font-style: normal; font-size: 32px; line-height: 1; }
    .pair .choice b, .pair .choice span { grid-column: 2; min-width: 0; } .pair .choice b { white-space: normal !important; line-height: 1.1; } .choice.big b { font-size: 13.5px !important; letter-spacing: .3px; }
    .choice.bonus { border-color: #ff5ae0 !important; box-shadow: 0 4px 0 #5a1a4a !important; } .choice.bonus b { color: #ff9af0; }
    #quickBox .game.kj { border-color: #ff7a3a; } #quickBox .game.ar { border-color: #b8d84a; } #quickBox .game.ar b { color: #d8f06a; } #quickBox .game.bu { border-color: #7dffb0; } #quickBox .game.bu b { color: #9affc8; }
    /* QUICK PLAY's own screen: pick a game and you're in */
    /* PICK A GAME and BONUS GAMES in the radar style: the main one in the middle (Tornado Time!, or the daily challenge), the rest as blips round it */
    #quickBox .qr { --S: min(92vw, 380px, calc(100vh - 230px)); position: relative; flex: none; width: var(--S); height: var(--S); }
    #quickBox .qr .game { --k: #7dff3a; position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); width: 29%; height: 29%; min-width: 0; padding: 0 !important; border-radius: 50%; display: grid; grid-template: none !important; place-content: center; justify-items: center; text-align: center !important; gap: 0; background-color: #1c0e34f2; border: 3px solid var(--k) !important; box-shadow: 0 0 16px var(--k); }
    #quickBox .qr .game.kj { --k: #ff8a3a; } #quickBox .qr .game.ar { --k: #d8f06a; } #quickBox .qr .game.bu { --k: #7dffb0; } #quickBox .qr .game[data-fun] { --k: #ff7ae0; } #quickBox .qr .game.mid[data-fun] { --k: #ffd24a; }
    #quickBox .qr .game i { grid-row: auto; font-size: calc(var(--S) * 0.085); line-height: 1.05; } #quickBox .qr .game b { font-size: clamp(8.5px, calc(var(--S) * 0.03), 12px); letter-spacing: .2px; line-height: 1.05; color: var(--k) !important; max-width: calc(var(--S) * 0.25); } #quickBox .qr .game span { font-size: clamp(7.5px, calc(var(--S) * 0.024), 10px); line-height: 1.1; color: #fff; max-width: calc(var(--S) * 0.24); }
    #quickBox .qr .game.mid { --x: 50%; --y: 50%; width: 38%; height: 38%; background-color: var(--k); box-shadow: 0 0 26px var(--k), 0 6px 0 #0008; } #quickBox .qr .game.mid i { font-size: calc(var(--S) * 0.1); } #quickBox .qr .game.mid b { color: #120a1f !important; font-size: clamp(11px, calc(var(--S) * 0.042), 16px); max-width: calc(var(--S) * 0.34); } #quickBox .qr .game.mid span { color: #120a1f; font-weight: 900; max-width: calc(var(--S) * 0.32); }
    #quickBox { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; padding: 16px; background: #1a0f2ef4; text-align: center; overflow-y: auto; }
    #quickBox.hidden { display: none; } #quickBox h2 { margin: 0; font-size: 30px; letter-spacing: 2px; color: #7dff3a; text-shadow: 0 2px 0 #5a2f80; } #quickBox p { margin: 0; font-size: 14px; color: #c9a6ff; }
    #quickBox .game { width: min(88vw, 360px); margin: 0; padding: 16px 14px; display: grid; gap: 3px; text-align: center; border: 3px solid #7dff3a; background-color: #24133f; color: #fff; border-radius: 16px; box-shadow: 0 6px 0 #0e0618, 0 8px 12px #0007; }
    #quickBox .game { grid-template-columns: 44px 1fr; grid-template-rows: auto auto; column-gap: 10px; row-gap: 1px; padding: 9px 12px !important; text-align: left !important; align-items: center; } #quickBox .game i { grid-row: 1 / 3; font-style: normal; font-size: 32px; line-height: 1; text-align: center; } #quickBox .game b { font-size: 17px; letter-spacing: 1px; color: #7dff3a; } #quickBox .game span { font-size: 11px; font-weight: 700; color: #ffd24a; }

      .exitBtn { order: 2; } .screen::after { order: 3; } /* EXIT sits last, under the sound buttons */

<body>
  <canvas id="scene"></canvas><div id="shade"></div><div id="flash"></div><div id="load"><i></i><i></i><i></i></div>
  <img id="logo" src="./logo.png" alt="Tornado Time!" width="1200" height="700">
  <div id="tap"><b>▶ TAP TO PLAY</b><small>🔊 Turn your sound on</small></div>
  <div id="menu" class="screen">
    <button class="choice quick" id="quickBtn"><b>▶ QUICK PLAY</b><span>Straight into a round, right where you left off.</span></button>
    <div class="pair">
      <button class="choice big" onclick="location.href='tornado.html'"><i class="ic">🌪️</i><b>TORNADO TIME!</b><span>Towns, eras, storms</span></button>
      <button class="choice big bonus" id="bonusBtn"><i class="ic">🎁</i><b>BONUS GAMES</b><span>More games and challenges</span></button>
    </div>
    <div class="pair">
      <button class="choice" onclick="location.href='store.html'" style="border-color:#ffd24a;box-shadow:0 4px 0 #5a4a1a !important"><i class="ic">🎨</i><b style="color:#ffd24a">SKIN SHOP</b><span class="saved" id="coins">Spend your coins</span></button>
      <button class="choice" id="radioBtn" style="border-color:#3af0ff;box-shadow:0 4px 0 #1a4a5a !important"><i class="ic">📻</i><b style="color:#3af0ff">RADIO</b><span>Pick your songs</span></button>
    </div>
    <button class="exitBtn" onclick="exitGame()">✖ EXIT GAME</button>
    <!-- Survival and Extract are hidden for now; the pages still work and can come back by removing hidden -->
    <button class="choice hidden" onclick="location.href='deadcity.html'"><b>DEAD CITY (SURVIVAL)</b><span>Third-person joystick. Six nights, spells, guns, vehicles, survivors and a chopper at dawn.</span><span class="saved" id="dcSaved"></span></button>
    <button class="choice hidden" onclick="location.href='zombieville.html'"><b>EXTRACT</b><span>Snake-style maze run. Gather a line of survivors and get them out by heli. Ten districts.</span><span class="saved" id="zvSaved"></span></button>

    <p class="credits">All monsters, robots and characters are original creations. Any resemblance to other characters is coincidental.</p>
  </div>
  <script type="module">import { stampVersion } from './src/version.js'; import { initSaveCodes } from './src/savecode.js'; import { soundToggle, radio, menuMusic, setMusicDuck, setMenuQuiet } from './src/audio.js'; setMenuQuiet(true); /* the game runs live behind this menu, without its sounds: only the buttons make any */ setMusicDuck(0.5);
    // the radio: same song and spot as the last page, from the first tap if the browser needs one
    radio();
    initSaveCodes(document.getElementById('menu'), document.querySelector('#menu .credits')); soundToggle(document.getElementById('menu')); stampVersion();
    window.__menuMusic = menuMusic;
  </script>
  <script type="module">
    // the opening: under five seconds of the game itself, then the logo and TAP TO PLAY; a tap brings up the menu (and, the
    // first time, lets the sound start). Coming back here from a game goes straight to the menu over the same live scene
    import { startIntroScene } from './src/introScene.js';
    const B = document.body.classList, flashEl = document.getElementById('flash'), first = new URLSearchParams(location.search).has('intro'); let flashV = 0, flashT = 0;
    const flash = (v) => { flashV = Math.max(flashV, v); if (flashT) return; const tick = () => { flashV = Math.max(0, flashV - 0.03); flashEl.style.opacity = Math.min(0.8, flashV * 2.6); flashT = flashV > 0 ? requestAnimationFrame(tick) : 0; }; flashT = requestAnimationFrame(tick); };
    let goAt = -1e9; addEventListener('click', (e) => { if (performance.now() - goAt < 600) { e.stopPropagation(); e.preventDefault(); } }, true); /* the tap that starts the game must not also press whatever menu button appears under the finger */
    const go = () => { if (B.contains('ready')) return; goAt = performance.now(); try { window.__menuMusic(); } catch { /* ignore */ } B.add('title', 'tap', 'ready'); };
    if (!first) B.add('title', 'tap', 'ready');
    let scene = null; try { scene = startIntroScene(document.getElementById('scene'), { intro: first, onBeat(what, v) { if (what === 'ready') B.add('live'); else if (what === 'flash') { if (!B.contains('ready')) flash(v); } else if (what === 'logo') B.add('title'); else if (what === 'tap') B.add('tap'); } }); } catch (e) { console.warn(e); }
    if (!scene) B.add('nogl', 'title', 'tap');
    setTimeout(() => B.add('title', 'tap'), 9000); // whatever happens, the way in shows up
    addEventListener('pointerdown', (e) => { if (!B.contains('ready')) { e.preventDefault(); go(); } }, true); addEventListener('keydown', go);
    window.__menu = { get scene() { return scene; }, go };
  </script>
  <!-- the player's emblem and level (player.js): bottom, left of EXIT GAME; a tap opens the PLAYER card (towns cleared, skins, badges) -->
  <script type="module">import { player, emblemSVG, openPlayerCard } from './src/player.js'; const b = document.createElement('button'); b.id = 'pbMenu'; b.setAttribute('aria-label', 'Player card'); b.style.cssText = 'padding:4px 10px 4px 4px;margin:0;display:flex;align-items:center;gap:6px;border-radius:14px;background:#1a0f2ee6 !important;border:2px solid #5a2f80;color:#fff;font-weight:900;font-size:12px;box-shadow:0 3px 0 #3a1f5a !important'; const pl = player(); b.innerHTML = emblemSVG(pl, 38) + '<span style="display:grid;text-align:left;line-height:1.15"><small style="font-size:9px;color:#c9a6ff;letter-spacing:1px">PLAYER</small>LVL ' + pl.level + '<small style="font-size:9px;color:#7dff3a">' + pl.got + ' / ' + pl.B.length + ' 🏅</small></span>'; b.addEventListener('click', (e) => { e.stopPropagation(); openPlayerCard(); }); const x = document.querySelector('#menu .exitBtn'); if (x) { const row = document.createElement('div'); row.className = 'exitRow'; row.style.cssText = 'display:flex;gap:10px;align-items:center;justify-content:center;order:2'; x.before(row); row.append(b, x); x.style.margin = '0'; } else document.body.appendChild(b);</script>
  <script type="module">import { openRadio } from './src/radioBox.js'; document.getElementById('radioBtn').addEventListener('click', openRadio);</script>
  <script type="module">
    // QUICK PLAY: pick a game and go straight into a round with the storm or monster you last used, in the town you
    // left off in (someone new starts in town 1). The game pages read ?quick and skip their own menu
    import { TOWNS, quickLevel } from './src/progress.js';
    let box = null;
    // the bonus games (add new ones here): [page, icon, name, what it is, save prefix, card style]
    const BONUS = [['kaiju.html', '🦖', 'KAIJU MADNESS', 'Be the monster: 60 to choose from', 'kj', 'kj'], ['airraid.html', '🧟', 'ZOMBIE AIR RAID', 'Burn the horde from the air', 'ar', 'ar'], ['beamup.html', '🛸', 'BEAM &#39;EM UP!', 'Be the UFO, or the walker', 'bu', 'bu']];
    const card = (go, icon, name, sub, g, cls, quick) => '<button class="game ' + cls + '" data-go="' + go + '" data-q="' + (quick ? 1 : '') + '"><i>' + icon + '</i><b>' + name + '</b><span' + (quick ? ' data-g="' + g + '"' : '') + '>' + sub + '</span></button>';
    function open(bonus) {
      if (!box) box = document.getElementById('quickBox'); if (!box) { box = document.createElement('div'); box.id = 'quickBox'; document.body.appendChild(box); }
      box.innerHTML = bonus ? '<h2>🎁 BONUS GAMES</h2><p>More ways to wreck the town.</p>' + BONUS.map((b) => card(b[0], b[1], b[2], b[3], b[4], b[5], false)).join('') + (window.__funCards ? window.__funCards() : '') + '<button class="ghost back">◀ BACK</button>'
        : '<h2>▶ QUICK PLAY</h2><p>Pick a game. You go straight in.</p>' + card('tornado.html', '🌪️', 'TORNADO TIME!', '', 'ta', '', true) + BONUS.map((b) => card(b[0], b[1], b[2], '', b[4], b[5], true)).join('') + '<button class="ghost back">◀ BACK</button>';
      { const gs = [...box.querySelectorAll('.game')], r = document.createElement('div'), mid = bonus ? (gs.find((g) => g.dataset.fun) || gs[0]) : gs[0], rest = gs.filter((g) => g !== mid); r.className = 'qr'; r.innerHTML = '<div class="scope"></div>'; gs[0].before(r); /* the radar: Tornado Time! (or the daily challenge) in the middle, the others evenly round it */
        mid.classList.add('mid'); r.append(mid); rest.forEach((g, i) => { const a = -Math.PI / 2 + (i + (rest.length % 2 ? 0 : 0.5)) * 2 * Math.PI / rest.length; g.style.setProperty('--x', (50 + Math.cos(a) * 34) + '%'); g.style.setProperty('--y', (50 + Math.sin(a) * 34) + '%'); r.append(g); }); for (const p of [...box.querySelectorAll('p')].slice(1)) p.remove(); }
      for (const b of box.querySelectorAll('.game')) b.addEventListener('click', () => { if (b.dataset.fun) window.__funOpen(b.dataset.fun); else location.href = b.dataset.go + (b.dataset.q ? '?quick=1' : ''); }); /* (data-fun: the DAILY CHALLENGE and TOWN STREAK cards, below) */
      box.querySelector('.back').addEventListener('click', () => box.classList.add('hidden'));
      for (const el of box.querySelectorAll('[data-g]')) { const n = quickLevel(el.dataset.g); el.textContent = 'LEVEL ' + n + ' · ' + TOWNS[n - 1].toUpperCase(); }
      box.classList.remove('hidden');
    }
    document.getElementById('quickBtn').addEventListener('click', () => open(false));
    document.getElementById('bonusBtn').addEventListener('click', () => open(true));
  </script>
  <script type="module">
    // DAILY CHALLENGE (one game a day, with a twist; winning it pays coins) and TOWN STREAK (town after town, each harder, until
    // you lose one): fun.js. Both sit on the BONUS GAMES screen as cards (__funCards), and open their own screen (__funOpen)
    import { FUN, daily, streakBest, endlessBest, clockText, GAMES4 } from './src/fun.js';
    const dailyLeft = () => { const n = new Date(), ms = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n, h = Math.floor(ms / 3600000), mi = Math.max(1, Math.ceil((ms % 3600000) / 60000)); return h ? h + ' h ' + mi + ' min' : mi + ' min'; }; /* until midnight here, when the next daily challenge starts */
    const CLS = { ta: '', kj: 'kj', ar: 'ar', bu: 'bu' }, box = () => document.getElementById('quickBox'), back = (b) => b.querySelector('.back').addEventListener('click', () => document.getElementById('bonusBtn').click());
    window.__funCards = () => { const d = daily(); return (FUN.daily || FUN.streak || FUN.endless ? '<p style="margin:6px 0 0">Challenges, in any of the games.</p>' : '')
      + (!FUN.daily ? '' : d.done ? '<button class="game" data-fun="daily" style="border-color:#6a6a78;filter:grayscale(1);opacity:.62"><i>📅</i><b style="color:#d6d6e2">DAILY CHALLENGE ✓ PASSED</b><span>Next one in ' + dailyLeft() + (d.streak ? ' · DAY ' + d.streak : '') + '</span></button>' /* beaten today: greyed out until tomorrow's (it still opens, to play again for fun) */
        : '<button class="game" data-fun="daily" style="border-color:#ff9a3a"><i>📅</i><b style="color:#ffb05a">DAILY CHALLENGE</b><span>TODAY: ' + d.icon + ' ' + d.twist.name + (d.streak ? ' · DAY ' + d.streak : '') + '</span></button>')
      + (FUN.streak ? '<button class="game" data-fun="streak" style="border-color:#c9a6ff"><i>🔥</i><b style="color:#c9a6ff">TOWN STREAK</b><span>How many towns in a row can you beat?</span></button>' : '')
      + (FUN.endless ? '<button class="game" data-fun="endless" style="border-color:#7dff3a"><i>♾️</i><b style="color:#9dff5a">ENDLESS</b><span>One round that never ends. How long can you last?</span></button>' : ''); };
    window.__funOpen = (k) => { const b = box(); if (!b) return;
      if (k === 'daily') { const d = daily(); b.innerHTML = '<h2>📅 DAILY CHALLENGE</h2><p>Today: <b style="color:#fff">' + d.icon + ' ' + d.title + '</b><br><b style="color:#ffb05a">' + d.twist.icon + ' ' + d.twist.name + '</b>: ' + d.twist.text + '<br>' + (d.done ? '<b style="color:#7dff3a">✓ PASSED TODAY.</b> The coins are yours. The next challenge starts in ' + dailyLeft() + '.' : 'Win it for coins. Days in a row pay more' + (d.streak ? ' (you are on ' + d.streak + ').' : '.')) + '</p><button class="game ' + CLS[d.game] + '"' + (d.done ? ' style="filter:grayscale(1);opacity:.62"' : '') + '><i>' + d.icon + '</i><b>' + (d.done ? '▶ PLAY IT AGAIN' : '▶ PLAY TODAY&#39;S') + '</b><span>' + (d.done ? 'Just for fun: no more coins today' : d.twist.name) + '</span></button><button class="ghost back">◀ BACK</button>';
        b.querySelector('.game').addEventListener('click', () => { location.href = d.page + '?daily=1'; }); back(b); return; }
      if (k === 'endless') { b.innerHTML = '<h2>♾️ ENDLESS</h2><p>One round in the biggest town. The waves keep coming, each one harder, until you go down. The longer you last, the more coins. Pick a game.</p>' + GAMES4.map(([g, page, icon, name]) => { const r = endlessBest(g); return '<button class="game ' + CLS[g] + '" data-go="' + page + '"><i>' + icon + '</i><b>' + name.replace("'", '&#39;') + '</b><span>' + (r ? 'BEST: WAVE ' + r.wave + ' · ' + clockText(r.secs) : 'No record yet') + '</span></button>'; }).join('') + '<button class="ghost back">◀ BACK</button>';
        for (const g of b.querySelectorAll('.game')) g.addEventListener('click', () => { location.href = g.dataset.go + '?endless=1'; }); back(b); return; }
      b.innerHTML = '<h2>🔥 TOWN STREAK</h2><p>Beat town after town. Each one is harder than the last. Lose one and the streak is over. Pick a game.</p>' + GAMES4.map(([g, page, icon, name]) => { const r = streakBest(g); return '<button class="game ' + CLS[g] + '" data-go="' + page + '"><i>' + icon + '</i><b>' + name.replace("'", '&#39;') + '</b><span>' + (r ? 'BEST: ' + r.towns + ' TOWN' + (r.towns === 1 ? '' : 'S') + ' IN A ROW' : 'No streak yet') + '</span></button>'; }).join('') + '<button class="ghost back">◀ BACK</button>';
      for (const g of b.querySelectorAll('.game')) g.addEventListener('click', () => { location.href = g.dataset.go + '?streak=1'; }); back(b); };
  </script>
  <script>
    try { if (localStorage.getItem('oo_save_dc')) document.getElementById('dcSaved').textContent = 'Saved game: night ' + (JSON.parse(localStorage.getItem('oo_save_dc')).night + 1); } catch (e) {}
    try { const c = Math.round(+JSON.parse(localStorage.getItem('oo_coins') || '0') * 100) / 100; if (c) document.getElementById('coins').textContent = '🪙 ' + c + (c === 1 ? ' coin' : ' coins'); } catch (e) {}
    try { if (localStorage.getItem('oo_save_zv')) document.getElementById('zvSaved').textContent = 'Saved game: district ' + JSON.parse(localStorage.getItem('oo_save_zv')).level; } catch (e) {}

<script>/* EXIT: leave full screen and go back to the title screen (a web page cannot close its own tab) */ window.exitGame = function () { var w = window; try { if (parent !== window && parent.document) w = parent; } catch (e) {} try { var d = w.document, x = d.exitFullscreen || d.webkitExitFullscreen; if ((d.fullscreenElement || d.webkitFullscreenElement) && x) x.call(d); if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} w.location.href = "index.html"; };</script>
  <script type="module">
    /* the STORM RADAR menu: the buttons this page already has (with everything wired to them) are moved into a radar scope */
    try { const menu = document.getElementById('menu'), q = document.getElementById('quickBtn'), pairs = [...menu.querySelectorAll(':scope > .pair > .choice')], pb = document.getElementById('pbMenu'), ex = menu.querySelector('.exitBtn'), snd = [...menu.querySelectorAll('.soundRow .soundBtn')], save = [...menu.querySelectorAll(':scope > .choice:not(.hidden):not(.quick)')][0];
      if (q && pairs.length === 4) { const r = document.createElement('div'); r.id = 'radar'; r.innerHTML = '<div class="scope"></div>'; q.before(r);
        const spot = [['27%', '25%', '#7dff3a', '-3.9s'], ['76%', '30%', '#ff7ae0', '-0.9s'], ['25%', '71%', '#ffd24a', '-3.0s'], ['75%', '74%', '#3af0ff', '-1.7s']]; /* Tornado Time!, Bonus, Shop, Radio: x, y, colour, when the sweep passes */
        pairs.forEach((b, i) => { b.removeAttribute('style'); for (const c of b.querySelectorAll('b')) c.removeAttribute('style'); b.style.setProperty('--x', spot[i][0]); b.style.setProperty('--y', spot[i][1]); b.style.setProperty('--k', spot[i][2]); b.style.setProperty('--d', spot[i][3]); r.append(b); });
        q.style.setProperty('--x', '50%'); q.style.setProperty('--y', '50%'); q.querySelector('b').textContent = '\u25B6 PLAY'; r.append(q); if (pb) { pb.removeAttribute('style'); r.append(pb); }
        const bar = document.createElement('div'); bar.className = 'rbar'; const add = (b, label) => { if (!b) return; const w = document.createElement('div'); w.className = 'rb'; w.append(b, label); b.setAttribute('aria-label', label); bar.append(w); };
        add(snd[0], 'SOUND'); add(snd[1], 'MUSIC'); if (save) { save.className = ''; save.innerHTML = '<b>\uD83D\uDCBE</b>'; add(save, 'SAVE'); } if (ex) { ex.textContent = '\u2716'; ex.removeAttribute('style'); add(ex, 'EXIT'); }
        r.after(bar); document.body.classList.add('rdr'); }
    } catch (e) { console.warn(e); }
  </script>
