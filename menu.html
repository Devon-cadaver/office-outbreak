<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tornado Time!" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <title>Tornado Time!</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    body { background: #120a1f; }
    #menu { gap: 14px; }
    #menu { overflow-y: auto; justify-content: flex-start; padding-top: 16px; }
    #menu .tag { color: #c9a6ff; font-size: 14px; margin-top: -6px; }
    .choice { width: min(88vw, 360px); text-align: left; padding: 14px 18px; display: grid; gap: 4px; border: 2px solid #7dff3a; background: #1a0f2e; color: #fff; border-radius: 14px; box-shadow: 0 6px 0 #3a1f5a; }
    .choice b { font-size: 20px; color: #7dff3a; letter-spacing: 1px; }
    .choice span { font-size: 13px; opacity: .85; font-weight: 400; }
    .choice .saved { color: #ffd24a; font-weight: 700; }
    /* the opening: the game itself, live, behind everything (src/introScene.js). body classes step through it:
       live (the scene is drawing) -> title (the logo has landed) -> tap (TAP TO PLAY is up) -> ready (the menu) */
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; opacity: 0; transition: opacity .4s; }
    body.live #scene { opacity: 1; }
    body.nogl { background: radial-gradient(circle at 50% 30%, #3a1c66, #120a1f 72%); } /* no 3D on this device: a plain backdrop */
    #shade { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .5s; background: linear-gradient(180deg, #0b061466 0%, #0b061499 28%, #0b0614d8 55%, #0b0614f4 80%); }
    body.ready #shade { opacity: 1; }
    #flash { position: fixed; inset: 0; z-index: 1; background: #f2ecff; opacity: 0; pointer-events: none; }
    #load { position: fixed; left: 50%; top: 50%; z-index: 1; display: flex; gap: 10px; transform: translate(-50%, -50%); } #load i { width: 12px; height: 12px; border-radius: 50%; background: #7dff3a; animation: loadDot .8s ease-in-out infinite alternate; } #load i:nth-child(2) { animation-delay: .15s; } #load i:nth-child(3) { animation-delay: .3s; }
    @keyframes loadDot { from { opacity: .25; transform: scale(.7); } } body.live #load, body.nogl #load { display: none; }
    :root { --logoW: min(92vw, 78vh, 580px); --logoSmall: min(62vw, 270px, 40vh); }
    #logo { position: fixed; left: 50%; top: calc(7vh + env(safe-area-inset-top, 0px)); width: var(--logoW); height: auto; z-index: 2; pointer-events: none; opacity: 0; transform: translateX(-50%) scale(2.8) rotate(-9deg); filter: drop-shadow(0 10px 16px #000b); }
    body.title #logo { opacity: 1; transform: translateX(-50%); transition: transform .4s cubic-bezier(.2, 1.5, .4, 1), opacity .12s, top .45s, width .45s; }
    body.ready #logo { top: calc(4px + env(safe-area-inset-top, 0px)); width: var(--logoSmall); }
    #tap { position: fixed; left: 50%; bottom: calc(10vh + env(safe-area-inset-bottom, 0px)); z-index: 3; display: grid; justify-items: center; gap: 10px; pointer-events: none; opacity: 0; transform: translateX(-50%) scale(.6); font-family: system-ui, 'Segoe UI', sans-serif; }
    #tap b { font-weight: 900; font-size: clamp(22px, 6vw, 34px); letter-spacing: 2px; white-space: nowrap; padding: 16px 42px; border-radius: 16px; border: 3px solid #120a1f; background: #7dff3a; color: #120a1f; box-shadow: 0 6px 0 #3a8a1a, 0 0 30px #7dff3a88; animation: tapPulse .9s ease-in-out infinite alternate; }
    #tap small { color: #f1ecfb; text-shadow: 0 2px 6px #000, 0 0 12px #000; font-weight: 700; font-size: 13px; }
    @keyframes tapPulse { to { transform: scale(1.06); } }
    body.tap #tap { opacity: 1; transform: translateX(-50%); transition: opacity .25s, transform .35s cubic-bezier(.2, 1.5, .4, 1); } body.ready #tap { display: none; }
    #menu { scrollbar-width: none; } #menu::-webkit-scrollbar { display: none; } /* it still scrolls on a short screen, without a bar down the side */
    body:not(.ready) { cursor: pointer; } body:not(.ready) #menu { pointer-events: none; overflow: hidden; } body:not(.ready) .ver { display: none; }
    #menu > :first-child { margin-top: 0; }
    #menu { display: flex; background: transparent !important; justify-content: flex-start !important; padding-top: calc(var(--logoSmall) * 0.583 + 12px + env(safe-area-inset-top, 0px)); /* the buttons start below the logo */ padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); gap: 8px !important; z-index: 1; }
    #menu > * { opacity: 0; transform: translateY(24px) scale(.96); transition: opacity .35s, transform .45s cubic-bezier(.2, 1.4, .4, 1); }
    body.ready #menu > * { opacity: 1; transform: none; }
    body.ready #menu > :nth-child(1) { transition-delay: 0.07s; } body.ready #menu > :nth-child(2) { transition-delay: 0.14s; } body.ready #menu > :nth-child(3) { transition-delay: 0.21s; } body.ready #menu > :nth-child(4) { transition-delay: 0.28s; } body.ready #menu > :nth-child(5) { transition-delay: 0.35s; } body.ready #menu > :nth-child(6) { transition-delay: 0.42s; } body.ready #menu > :nth-child(7) { transition-delay: 0.49s; } body.ready #menu > :nth-child(8) { transition-delay: 0.56s; }
    .choice { padding: 9px 14px !important; gap: 1px !important; box-shadow: 0 4px 0 #3a1f5a !important; }
    .choice b { font-size: 17px !important; } .choice span { font-size: 11.5px !important; }
    /* QUICK PLAY is the one big button; under it the rest sit in pairs so a new player sees one obvious thing to press */
    .choice.quick { text-align: center; padding: 13px 14px !important; gap: 2px !important; border: 0; background-color: #7dff3a; color: #120a1f; box-shadow: 0 6px 0 #3f9a1f, 0 8px 12px #0007 !important; }
    .choice.quick b { font-size: 26px !important; letter-spacing: 2px; color: #120a1f; } .choice.quick span { font-size: 12px !important; font-weight: 700; opacity: .75; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(88vw, 360px); }
    .pair .choice { width: auto; min-width: 0; margin: 0; padding: 9px 10px !important; } .pair .choice b { font-size: 13.5px !important; letter-spacing: .3px; white-space: nowrap; } .pair .choice span { font-size: 10.5px !important; }
    #menu > .choice:not(.quick) { padding: 8px 14px !important; } #menu > .choice:not(.quick) b { font-size: 14px !important; } #menu > .choice:not(.quick) span { display: none; } /* SAVE CODE: one small line */
    /* QUICK PLAY's own screen: pick a game and you're in */
    #quickBox { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; padding: 16px; background: #1a0f2ef4; text-align: center; overflow-y: auto; }
    #quickBox.hidden { display: none; } #quickBox h2 { margin: 0; font-size: 30px; letter-spacing: 2px; color: #7dff3a; text-shadow: 0 2px 0 #5a2f80; } #quickBox p { margin: 0; font-size: 14px; color: #c9a6ff; }
    #quickBox .game { width: min(88vw, 360px); margin: 0; padding: 16px 14px; display: grid; gap: 3px; text-align: center; border: 3px solid #7dff3a; background-color: #24133f; color: #fff; border-radius: 16px; box-shadow: 0 6px 0 #0e0618, 0 8px 12px #0007; }
    #quickBox .game i { font-style: normal; font-size: 44px; line-height: 1.1; } #quickBox .game b { font-size: 22px; letter-spacing: 1px; color: #7dff3a; } #quickBox .game span { font-size: 13px; font-weight: 700; color: #ffd24a; }
    #quickBox .game.kj { border-color: #ff7a3a; } #quickBox .game.kj b { color: #ff9a5a; }
    .credits { order: 99; margin: auto 0 0 !important; max-width: min(88vw, 360px); font-size: 9.5px !important; line-height: 1.3; color: #a898c8; opacity: .8; text-align: center; }
      .exitBtn { order: 2; } .screen::after { order: 3; } /* EXIT sits last, under the sound buttons */
  </style>
</head>
<body>
  <canvas id="scene"></canvas><div id="shade"></div><div id="flash"></div><div id="load"><i></i><i></i><i></i></div>
  <img id="logo" src="./logo.png" alt="Tornado Time!" width="1200" height="700">
  <div id="tap"><b>▶ TAP TO PLAY</b><small>🔊 Turn your sound on</small></div>
  <div id="menu" class="screen">
    <button class="choice quick" id="quickBtn"><b>▶ QUICK PLAY</b><span>Straight into a round, right where you left off.</span></button>
    <div class="pair">
      <button class="choice" onclick="location.href='tornado.html'"><b>🌪️ TORNADO TIME!</b><span>Towns, eras and storms</span></button>
      <button class="choice" onclick="location.href='kaiju.html'" style="border-color:#ff7a3a;box-shadow:0 4px 0 #5a2a1a !important"><b style="color:#ff9a5a">🦖 KAIJU MADNESS</b><span>Bonus game: 60 monsters</span></button>
    </div>
    <!-- the two newest bonus games -->
    <div class="pair">
      <button class="choice" onclick="location.href='airraid.html'" style="border-color:#b8d84a;box-shadow:0 4px 0 #3a4a1a !important"><b style="color:#d8f06a">🧟 ZOMBIE AIR RAID</b><span>Bonus: save the town</span></button>
      <button class="choice" onclick="location.href='beamup.html'" style="border-color:#7dffb0;box-shadow:0 4px 0 #1a5a3a !important"><b style="color:#9affc8">🛸 BEAM &#39;EM UP!</b><span>Bonus: be the UFO</span></button>
    </div>
    <div class="pair">
      <button class="choice" onclick="location.href='store.html'" style="border-color:#ffd24a;box-shadow:0 4px 0 #5a4a1a !important"><b style="color:#ffd24a">🎨 SKIN SHOP</b><span class="saved" id="coins">Spend your coins</span></button>
      <button class="choice" id="radioBtn" style="border-color:#3af0ff;box-shadow:0 4px 0 #1a4a5a !important"><b style="color:#3af0ff">📻 RADIO</b><span>Pick your songs</span></button>
    </div>
    <button class="exitBtn" onclick="exitGame()">✖ EXIT GAME</button>
    <!-- Survival and Extract are hidden for now; the pages still work and can come back by removing hidden -->
    <button class="choice hidden" onclick="location.href='deadcity.html'"><b>DEAD CITY (SURVIVAL)</b><span>Third-person joystick. Six nights, spells, guns, vehicles, survivors and a chopper at dawn.</span><span class="saved" id="dcSaved"></span></button>
    <button class="choice hidden" onclick="location.href='zombieville.html'"><b>EXTRACT</b><span>Snake-style maze run. Gather a line of survivors and get them out by heli. Ten districts.</span><span class="saved" id="zvSaved"></span></button>

    <p class="credits">All monsters, robots and characters are original creations. Any resemblance to other characters is coincidental.</p>
  </div>
  <script type="module">import { stampVersion } from './src/version.js'; import { initSaveCodes } from './src/savecode.js'; import { soundToggle, radio, menuMusic, setMusicDuck } from './src/audio.js'; setMusicDuck(0.5);
    // the radio: same song and spot as the last page, from the first tap if the browser needs one
    radio();
    initSaveCodes(document.getElementById('menu'), document.querySelector('#menu .credits')); soundToggle(document.getElementById('menu')); stampVersion();
    window.__menuMusic = menuMusic;
  </script>
  <script type="module">
    // the opening: under five seconds of the game itself, then the logo and TAP TO PLAY; a tap brings up the menu (and, the
    // first time, lets the sound start). Coming back here from a game goes straight to the menu over the same live scene
    import { startIntroScene } from './src/introScene.js';
    const B = document.body.classList, flashEl = document.getElementById('flash'), first = new URLSearchParams(location.search).has('intro'); let flashV = 0, flashT = 0;
    const flash = (v) => { flashV = Math.max(flashV, v); if (flashT) return; const tick = () => { flashV = Math.max(0, flashV - 0.03); flashEl.style.opacity = Math.min(0.8, flashV * 2.6); flashT = flashV > 0 ? requestAnimationFrame(tick) : 0; }; flashT = requestAnimationFrame(tick); };
    const go = () => { if (B.contains('ready')) return; try { window.__menuMusic(); } catch { /* ignore */ } B.add('title', 'tap', 'ready'); };
    if (!first) B.add('title', 'tap', 'ready');
    let scene = null; try { scene = startIntroScene(document.getElementById('scene'), { intro: first, onBeat(what, v) { if (what === 'ready') B.add('live'); else if (what === 'flash') { if (!B.contains('ready')) flash(v); } else if (what === 'logo') B.add('title'); else if (what === 'tap') B.add('tap'); } }); } catch (e) { console.warn(e); }
    if (!scene) B.add('nogl', 'title', 'tap');
    setTimeout(() => B.add('title', 'tap'), 9000); // whatever happens, the way in shows up
    addEventListener('pointerdown', (e) => { if (!B.contains('ready')) { e.preventDefault(); go(); } }, true); addEventListener('keydown', go);
    window.__menu = { get scene() { return scene; }, go };
  </script>
  <!-- the player's emblem and level (player.js): top left; a tap opens the PLAYER card (towns cleared, skins, badges) -->
  <script type="module">import { player, emblemSVG, openPlayerCard } from './src/player.js'; const b = document.createElement('button'); b.id = 'pbMenu'; b.setAttribute('aria-label', 'Player card'); b.style.cssText = 'position:fixed;z-index:40;left:max(10px, env(safe-area-inset-left, 0px));top:calc(10px + env(safe-area-inset-top, 0px));padding:4px 10px 4px 4px;margin:0;display:flex;align-items:center;gap:6px;border-radius:14px;background:#1a0f2ee6 !important;border:2px solid #5a2f80;color:#fff;font-weight:900;font-size:12px;box-shadow:0 3px 0 #3a1f5a !important'; const pl = player(); b.innerHTML = emblemSVG(pl, 38) + '<span style="display:grid;text-align:left;line-height:1.15"><small style="font-size:9px;color:#c9a6ff;letter-spacing:1px">PLAYER</small>LVL ' + pl.level + '<small style="font-size:9px;color:#7dff3a">' + pl.got + ' / ' + pl.B.length + ' 🏅</small></span>'; b.addEventListener('click', (e) => { e.stopPropagation(); openPlayerCard(); }); document.body.appendChild(b);</script>
  <script type="module">import { openRadio } from './src/radioBox.js'; document.getElementById('radioBtn').addEventListener('click', openRadio);</script>
  <script type="module">
    // QUICK PLAY: pick a game and go straight into a round with the storm or monster you last used, in the town you
    // left off in (someone new starts in town 1). The game pages read ?quick and skip their own menu
    import { TOWNS, quickLevel } from './src/progress.js';
    let box = null;
    function open() {
      if (!box) { box = document.createElement('div'); box.id = 'quickBox';
        box.innerHTML = '<h2>▶ QUICK PLAY</h2><p>Pick a game. You go straight in.</p>'
          + '<button class="game" data-go="tornado.html"><i>🌪️</i><b>TORNADO TIME!</b><span data-g="ta"></span></button>'
          + '<button class="game kj" data-go="kaiju.html"><i>🦖</i><b>KAIJU MADNESS</b><span data-g="kj"></span></button>'
          + '<button class="game" data-go="airraid.html"><i>🧟</i><b>ZOMBIE AIR RAID</b><span data-g="ar"></span></button>'
          + '<button class="game" data-go="beamup.html"><i>🛸</i><b>BEAM &#39;EM UP!</b><span data-g="bu"></span></button><button class="ghost back">◀ BACK</button>';
        document.body.appendChild(box);
        for (const b of box.querySelectorAll('.game')) b.addEventListener('click', () => { location.href = b.dataset.go + '?quick=1'; });
        box.querySelector('.back').addEventListener('click', () => box.classList.add('hidden')); }
      for (const el of box.querySelectorAll('[data-g]')) { const n = quickLevel(el.dataset.g); el.textContent = 'LEVEL ' + n + ' · ' + TOWNS[n - 1].toUpperCase(); }
      box.classList.remove('hidden');
    }
    document.getElementById('quickBtn').addEventListener('click', open);
  </script>
  <script>
    try { if (localStorage.getItem('oo_save_dc')) document.getElementById('dcSaved').textContent = 'Saved game: night ' + (JSON.parse(localStorage.getItem('oo_save_dc')).night + 1); } catch (e) {}
    try { const c = Math.round(+JSON.parse(localStorage.getItem('oo_coins') || '0') * 100) / 100; if (c) document.getElementById('coins').textContent = '🪙 ' + c + (c === 1 ? ' coin' : ' coins'); } catch (e) {}
    try { if (localStorage.getItem('oo_save_zv')) document.getElementById('zvSaved').textContent = 'Saved game: district ' + JSON.parse(localStorage.getItem('oo_save_zv')).level; } catch (e) {}
  </script>
<script>/* EXIT: leave full screen and go back to the title screen (a web page cannot close its own tab) */ window.exitGame = function () { var w = window; try { if (parent !== window && parent.document) w = parent; } catch (e) {} try { var d = w.document, x = d.exitFullscreen || d.webkitExitFullscreen; if ((d.fullscreenElement || d.webkitFullscreenElement) && x) x.call(d); if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} w.location.href = "index.html"; };</script>
</body>
</html>
