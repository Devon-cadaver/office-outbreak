<!doctype html>
<html><head><meta charset="utf-8"><title>Background scene</title>
<style>html, body { margin: 0; background: #120a1f; overflow: hidden; } canvas { display: block; }</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// The itch page background, as a seamless loop: the Acid Storm spinning on the left, the saucer beaming people up on the
// right. The middle stays still (the page column covers it), which keeps the GIF small. Everything that moves does a
// whole number of turns or trips per loop, so the last frame runs straight into the first.
// window.renderAt(t) draws the frame t seconds into the loop (L seconds long). Open through the dev server:
//   http://localhost:5188/release/itch/tornado-time/background-scene.html
import * as THREE from 'three';
import { createTwisters } from '/src/tornado.js';
import { makeSaucer } from '/src/ally/foeModels.js';
import { makeCharacter, animateWalk } from '/src/poster/characters.js';
import { mulberry32 } from '/src/city.js';
const W = 1920, H = 1080, L = 2.8 /* 28 frames, a tenth of a second each */, TAU = Math.PI * 2, GROUND = -8.6, R = mulberry32(77), rnd = (a, b) => a + R() * (b - a), lerp = (a, b, k) => a + (b - a) * k;
const canvas = document.getElementById('c'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); renderer.setSize(W, H);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40, W / H, 1, 200); cam.position.set(0, 0, 30); cam.lookAt(0, 0, 0); // the frame is 38.8 units wide and 21.8 tall at the origin
{ const c = document.createElement('canvas'); c.width = 2; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256); // night sky, a band of dusk low down, then the page's own colour at the foot so it runs into the page
  gr.addColorStop(0, '#07040f'); gr.addColorStop(0.4, '#140a26'); gr.addColorStop(0.7, '#2a1a4c'); gr.addColorStop(0.84, '#3a2a62'); gr.addColorStop(0.9, '#120a1f'); gr.addColorStop(1, '#120a1f'); g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
scene.add(new THREE.HemisphereLight(0xb8c4ff, 0x2a2438, 1.7)); const sun = new THREE.DirectionalLight(0xd8dcff, 0.9); sun.position.set(-6, 10, 14); scene.add(sun);
const basic = (c, o = {}) => new THREE.MeshBasicMaterial({ color: c, ...o }), glow = (c, op) => basic(c, { transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
const box = new THREE.BoxGeometry(1, 1, 1), ball = new THREE.IcosahedronGeometry(1, 1);
// ---------- still things: stars, and a skyline along the foot of the picture ----------
{ const pos = []; for (let i = 0; i < 140; i++) pos.push(rnd(-20, 20), rnd(0, 10.8), -20); const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfd8ff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.7 }))); }
{ const dark = [basic(0x0e0818), basic(0x150c26), basic(0x1b1030)], lit = basic(0xf6e94a), roof = basic(0x0a0612); let x = -21;
  const foot = new THREE.Mesh(box, basic(0x120a1f)); foot.scale.set(60, 6, 1); foot.position.set(0, GROUND - 3, -3); scene.add(foot);
  while (x < 21) { const w = rnd(1.4, 3), h = rnd(1.2, 4.2), z = rnd(-6, -3.5), b = new THREE.Mesh(box, dark[(R() * 3) | 0]); b.scale.set(w, h, 1); b.position.set(x + w / 2, GROUND + h / 2, z); scene.add(b);
    if (R() < 0.45) { const r = new THREE.Mesh(new THREE.ConeGeometry(w * 0.75, 0.9, 4), roof); r.rotation.y = Math.PI / 4; r.scale.z = 0.2; r.position.set(x + w / 2, GROUND + h + 0.45, z); scene.add(r); }
    for (let k = 0; k < 4; k++) if (R() < 0.5) { const m = new THREE.Mesh(box, lit); m.scale.set(0.22, 0.3, 0.05); m.position.set(x + rnd(0.3, w - 0.3), GROUND + rnd(0.5, Math.max(0.6, h - 0.4)), z + 0.55); scene.add(m); }
    x += w + rnd(0.1, 0.6); } }

// ---------- left: the Acid Storm ----------
// (sized and placed for the strip of background that shows beside the page column: on a 1920 screen that is the outer 480 px each side)
const tw = createTwisters(scene), SX = -12.8, SH = 0.95, K = 1, storm = tw.make(true, [], 'acid'), T = storm.userData.twister; storm.scale.setScalar(SH); storm.position.set(SX, GROUND, 0); scene.add(storm);
const baby = tw.make(false, [], 'acid', { baby: true }), BT = baby.userData.twister; baby.scale.setScalar(0.8); scene.add(baby);
tw.update(0.0001); // once, so every part exists; after that this page moves each of them itself, in step with the loop
for (const t of [T, BT]) for (const Lr of t.layers) Lr.geometry.attributes.position.array.set(Lr.userData.base); // the funnels straight again: the game had bent them for its own clock
for (const t of [T, BT]) { t.junk.visible = false; t.dust.visible = false; if (t.lights) t.lights.visible = false; if (t.shadow) t.shadow.visible = false; }
const local = (tornado, group) => ({ r: (y) => tw.radiusAt(tornado, y), add: (m) => { group.add(m); return m; } });
const SL = local(T, storm), JUNK = [0x3a5a1a, 0x7dff3a, 0x2a2a20, 0xd8c81a], lam = (c) => new THREE.MeshLambertMaterial({ color: c });
const bits = []; for (let i = 0; i < 26; i++) { const m = SL.add(new THREE.Mesh(box, lam(JUNK[i % 4]))), s = rnd(0.12, 0.3); m.scale.set(s * (i % 2 ? 2.6 : 1), s * 0.6 * K, s); bits.push({ m, a: R() * TAU, y: rnd(0.6, T.H * 0.88), k: 1 + (i % 2), sp: [1 + (i % 3), 1, 2] }); } // wreckage riding the funnel
const orbs = []; for (let i = 0; i < 20; i++) { const m = SL.add(new THREE.Mesh(ball, glow([0x7dff3a, 0xd8ff3a, 0x3aff8a][i % 3], 0.9))); orbs.push({ m, a: R() * TAU, y0: R(), s: rnd(0.1, 0.2) }); } // the glow that climbs it
const puffs = []; for (let i = 0; i < 11; i++) { const m = SL.add(new THREE.Mesh(ball, basic(0x3f7a22, { transparent: true, opacity: 0.4, depthWrite: false }))); puffs.push({ m, a: (i / 11) * TAU, r: rnd(1.3, 2.6), s: rnd(0.55, 1) }); } // dust dragged round its foot
for (const it of T.items) { it.a0 = it.a; it.y0 = it.y; it.o.scale.y *= K; } // the barrels the skin carries
// acid rain round it: each streak falls a whole number of screens per loop
const rainN = 50, rain = [], rainPos = new Float32Array(rainN * 6), rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3)); scene.add(new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0x9dff5a, transparent: true, opacity: 0.55 })));
for (let i = 0; i < rainN; i++) rain.push({ x: rnd(-18.2, -7.6), z: rnd(-2, 5), y0: R(), k: 1 + (i % 2) });
// one green bolt a loop, out of the cloud to the rooftops beside it
const bolt = new THREE.Group(); { const pts = []; let x = SX - 2.9, y = GROUND + T.H * SH * 0.98; while (y > GROUND + 1.4) { pts.push([x, y]); y -= rnd(0.5, 1.0); x = Math.max(SX - 4.6, Math.min(SX - 2.3, x + rnd(-0.6, 0.6))); } pts.push([x, GROUND + 1.0]);
  const strip = (w, mat) => { const p = []; for (let i = 0; i < pts.length - 1; i++) { const [ax, ay] = pts[i], [bx, by] = pts[i + 1], dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy), nx = -dy / l * w, ny = dx / l * w; p.push(ax - nx, ay - ny, 2, ax + nx, ay + ny, 2, bx + nx, by + ny, 2, ax - nx, ay - ny, 2, bx + nx, by + ny, 2, bx - nx, by - ny, 2); } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); bolt.add(new THREE.Mesh(g, mat)); };
  strip(0.2, glow(0x7dff3a, 0.3)); strip(0.085, glow(0xb8ff6a, 0.7)); strip(0.035, basic(0xffffff, { side: THREE.DoubleSide }));
  for (const [px, py] of pts) { const j = new THREE.Mesh(new THREE.CircleGeometry(0.085, 10), glow(0xb8ff6a, 0.7)); j.position.set(px, py, 2); bolt.add(j); } // a dot at each bend closes the joints
  const hit = new THREE.Mesh(new THREE.CircleGeometry(1, 20), glow(0xb8ff6a, 0.5)); hit.scale.set(0.9, 0.4, 1); hit.position.set(pts[pts.length - 1][0], GROUND + 1.0, 2); bolt.add(hit); scene.add(bolt); }
const flash = new THREE.PointLight(0xb8ff6a, 0, 20, 0); flash.position.set(SX - 2, 2, 8); /* reaches the storm and the roofs under it, not across the page to the saucer */ scene.add(flash); T.cap.material.color.setHex(0x2c5522); BT.cap.material.color.setHex(0x2c5522); T.cap.material.opacity = 0.85; const capCol = T.cap.material.color.clone(), WHITE = new THREE.Color(0xd8ffb0);

// ---------- right: the saucer, beaming people up ----------
const UX = 13.6, UY = 3.5, ufo = makeSaucer(); ufo.scale.setScalar(1.5); ufo.userData.shield.visible = false; scene.add(ufo);
const TOP = UY - 0.6, LEN = TOP - GROUND, beamGeo = (r0, r1) => new THREE.CylinderGeometry(r0, r1, 1, 28, 1, true).translate(0, -0.5, 0);
const beam = new THREE.Mesh(beamGeo(0.45, 2.7), glow(0x7df0ff, 0.2)), core = new THREE.Mesh(beamGeo(0.25, 1.5), glow(0xd0fbff, 0.14)); for (const m of [beam, core]) { m.scale.y = LEN; scene.add(m); }
const pool = new THREE.Mesh(new THREE.CircleGeometry(1, 28), glow(0x7df0ff, 0.4)); pool.scale.set(3, 0.5, 1); pool.position.set(UX, GROUND + 0.1, 1); scene.add(pool);
const rings = []; for (let i = 0; i < 5; i++) { const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.03, 6, 40), glow(0xd0fbff, 0.6)); m.rotation.x = Math.PI / 2; scene.add(m); rings.push(m); } // rings of light running up the beam
const people = []; ['worker', 'pink', 'plaid', 'hivis', 'suit', 'hoodie'].forEach((o, i) => { const c = makeCharacter(o, { look: R() }); c.userData.panic = true; c.userData.idle = 0; scene.add(c); people.push({ c, ph: i / 6, a: R() * TAU, r: rnd(0.5, 1.5), turns: 1 + (i % 2) }); });

// the funnel bends in a slow S that runs up it once a loop; everything riding it reads the same bend
const bo = { x: 0, z: 0 }, bend = (t, y, w) => { const k = Math.max(0, y) / t.H, a = 0.34 * k * t.wob; bo.x = Math.sin(w - y * 0.55) * a; bo.z = Math.cos(w - y * 0.5) * a; return bo; };
const cm = new THREE.Matrix4(), cq = new THREE.Quaternion(), cp = new THREE.Vector3(), cs = new THREE.Vector3();
function spin(t, u) { const w = TAU * u;
  t.layers.forEach((Lr, i) => { Lr.material.map.offset.x = -u * (3 + i); Lr.material.map.offset.y = u; Lr.rotation.y = w * (i === 2 ? 1 : 2);
    const P = Lr.geometry.attributes.position, A = P.array, B = Lr.userData.base, ca = Math.cos(Lr.rotation.y), sa = Math.sin(Lr.rotation.y); for (let q = 0; q < A.length; q += 3) { const b = bend(t, B[q + 1], w); A[q] = B[q] + b.x * ca - b.z * sa; A[q + 2] = B[q + 2] + b.x * sa + b.z * ca; } P.needsUpdate = true; });
  const top = bend(t, t.H, w), tx = top.x, tz = top.z; // the cloud over it follows the top of the funnel, and heaves a little
  t.capP.forEach((p, i) => { const a = p.a + Math.sin(w + i) * 0.06; cp.set(Math.cos(a) * p.rr + tx, p.y + Math.sin(w + i * 1.7) * 0.14, Math.sin(a) * p.rr + tz); cs.set(p.s * 1.6, p.s * 0.55, p.s); cm.compose(cp, cq, cs); t.cap.setMatrixAt(i, cm); }); t.cap.instanceMatrix.needsUpdate = true; }
{ const c = document.createElement('canvas'); c.width = 256; c.height = 4; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 256, 0); gr.addColorStop(0, 'rgba(18,10,31,1)'); gr.addColorStop(0.006, 'rgba(18,10,31,1)'); gr.addColorStop(0.032, 'rgba(18,10,31,0)'); gr.addColorStop(0.968, 'rgba(18,10,31,0)'); gr.addColorStop(0.994, 'rgba(18,10,31,1)'); gr.addColorStop(1, 'rgba(18,10,31,1)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 4);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthTest: false, depthWrite: false })); m.renderOrder = 99; m.frustumCulled = false; const d = 2, hh = 2 * d * Math.tan(THREE.MathUtils.degToRad(20)); m.scale.set(hh * W / H, hh, 1); m.position.set(0, 0, -d); cam.add(m); scene.add(cam); } // the picture's left and right edges melt into the page colour, for screens wider than the picture
window.L = L;
window.renderAt = (time) => {
  const u = ((time / L) % 1 + 1) % 1, w = TAU * u;
  // the storm: the funnel's layers turn and their streaks run round, it sways, and everything in it circles or climbs
  spin(T, u); spin(BT, u); storm.rotation.z = Math.sin(w) * 0.03; storm.rotation.x = Math.cos(w) * 0.02;
  for (const b of bits) { const a = b.a + w * b.k, r = SL.r(b.y) * 1.05, o = bend(T, b.y, w); b.m.position.set(Math.cos(a) * r + o.x, b.y, Math.sin(a) * r + o.z); b.m.rotation.set(w * b.sp[0], w * b.sp[1], w * b.sp[2]); }
  for (const o of orbs) { const y = ((o.y0 + u) % 1) * T.H, a = o.a + w * 2, r = SL.r(y) * 0.8, q2 = bend(T, y, w); o.m.position.set(Math.cos(a) * r + q2.x, y, Math.sin(a) * r + q2.z); { const q = o.s * (1 + Math.sin(w * 3 + o.a) * 0.35); o.m.scale.set(q, q * K, q); } }
  for (const p of puffs) { const a = p.a + w; p.m.position.set(Math.cos(a) * p.r, 0.45, Math.sin(a) * p.r); { const q = p.s * (1 + Math.sin(w * 2 + p.a) * 0.25); p.m.scale.set(q, q * K, q); } }
  for (const it of T.items) { const a = it.a0 + w, r = SL.r(it.y0) * 1.05, o = bend(T, it.y0, w); it.o.position.set(Math.cos(a) * r + o.x, it.y0, Math.sin(a) * r + o.z); it.o.rotation.set(w * 2, 0, w); }
  baby.position.set(SX + 0.3 + Math.cos(w) * 3.1, GROUND, Math.sin(w) * 2.4); // a baby tornado circling it, round the front and away behind
  for (let i = 0; i < rainN; i++) { const r = rain[i], y = 11.5 - (((r.y0 + u * r.k) % 1) * 21); rainPos.set([r.x, y, r.z, r.x - 0.12, y - 0.75, r.z], i * 6); } rainGeo.attributes.position.needsUpdate = true;
  const f = u >= 0.5 && u < 0.56; bolt.visible = f; flash.intensity = f ? 2.4 : 0; T.cap.material.color.copy(capCol).lerp(WHITE, f ? 0.4 : 0);
  // the saucer: it bobs and turns, its rim lights run, and its catch rises up the beam one after another
  const ux = UX + Math.sin(w) * 0.3, uy = UY + Math.sin(w * 2) * 0.16; ufo.position.set(ux, uy, 0); ufo.rotation.set(0.24, w, Math.sin(w) * 0.05); ufo.userData.ring.material.map.offset.x = u * 3;
  for (const m of [beam, core]) m.position.set(ux, uy - 0.6, 0); beam.material.opacity = 0.2 + Math.sin(w * 4) * 0.03; pool.material.opacity = 0.4 + Math.sin(w * 4) * 0.06;
  rings.forEach((m, i) => { const k = (u + i / rings.length) % 1; m.position.set(ux, lerp(GROUND + 0.3, TOP, k), 0); m.scale.setScalar(lerp(2.6, 0.5, k)); m.material.opacity = 0.6 * Math.sin(Math.PI * k); });
  for (const P of people) { const c = P.c, k = (u + P.ph) % 1, a = P.a + w, r = P.r * (1 - k * 0.85) + 0.05, s = 0.82 * (k > 0.82 ? 1 - (k - 0.82) / 0.18 * 0.75 : 1) * Math.min(1, k * 12);
    c.position.set(ux + Math.cos(a) * r, lerp(GROUND, TOP - 0.6, k), Math.sin(a) * r); c.scale.setScalar(Math.max(0.001, s)); c.rotation.set(Math.sin(w * 2 + P.a) * 0.3, w * P.turns + P.a, Math.cos(w * 2 + P.a) * 0.3); c.userData.phase = w * 4 + P.a; animateWalk(c, 0, 1.4); }
  renderer.render(scene, cam);
};
window.renderAt(0); document.body.dataset.ready = '1';
</script></body></html>
