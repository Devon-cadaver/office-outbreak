<!doctype html>
<html><head><meta charset="utf-8"><title>Background tile</title>
<style>html, body { margin: 0; background: #0e0818; overflow: hidden; } canvas { display: block; }</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// A background that repeats down the page (itch: Repeat vertically) as a seamless loop: a close-up of the tornado's
// spinning wall on the left, debris flung out of it across to the right, and rain. No ground or sky, so the top edge
// matches the bottom edge: the wall's streaks repeat a whole number of times per tile, and anything crossing the top or
// bottom edge is drawn on the other edge too. The middle stays still (the page column covers it). renderAt(t) draws t
// seconds into the loop.
import * as THREE from 'three';
import { createTwisters } from '/src/tornado.js';
import { makeCar } from '/src/car.js';
import { makeCharacter } from '/src/poster/characters.js';
const Q = new URLSearchParams(location.search);
const W = 1920, H = +Q.get('h') || 800, L = 2.4, TAU = Math.PI * 2, PAGE = 500, RAIN = Q.has('rain') ? +Q.get('rain') : 0.4;
const canvas = document.getElementById('c'); const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); renderer.setSize(W, H);
const scene = new THREE.Scene();
// left-to-right shading only (so it's the same at every height): storm-grey behind the wall, page colour in the middle
{ const c = document.createElement('canvas'); c.width = 256; c.height = 2; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 256, 0); gr.addColorStop(0, '#2a2c2a'); gr.addColorStop(0.3, '#16141c'); gr.addColorStop(0.5, '#0e0818'); gr.addColorStop(0.75, '#13111c'); gr.addColorStop(1, '#1c1c24'); g.fillStyle = gr; g.fillRect(0, 0, 256, 2); const bt = new THREE.CanvasTexture(c); bt.colorSpace = THREE.SRGBColorSpace; scene.background = bt; }
scene.add(new THREE.HemisphereLight(0xa8b8b0, 0x2a2430, 1.6)); const sun = new THREE.DirectionalLight(0xd8f0e0, 1.0); sun.position.set(400, 300, 900); scene.add(sun);
const cam = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -3000, 3000); cam.position.set(0, 0, 1500);
// the wall: the game's own funnel materials on straight cylinders, the streaks repeating twice per tile
const T = createTwisters(scene).make(true, []).userData.twister; const WX = -1090, R = 480;
const core = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.93, R * 0.93, H, 48, 1, true), new THREE.MeshBasicMaterial({ color: 0x24221e })); core.position.x = WX; scene.add(core);
const walls = [[0x3e3c36, 0.95, 1.0], [0x625e54, 0.68, 1.06], [0x8a8472, 0.42, 1.14]].map(([c, o, k], i) => { const m = T.layers[i].material.clone(); m.map = T.layers[i].material.map.clone(); m.map.needsUpdate = true; m.map.repeat.set(3, 2); m.color.setHex(c); m.opacity = o;
  const w = new THREE.Mesh(new THREE.CylinderGeometry(R * k, R * k, H, 64, 1, true), m); w.position.x = WX; w.renderOrder = 2 + i; scene.add(w); return w; });
// shading: the wall darkens toward its edge, so it reads as round
{ const c = document.createElement('canvas'); c.width = 256; c.height = 2; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 256, 0); gr.addColorStop(0, 'rgba(8,6,12,0.05)'); gr.addColorStop(0.55, 'rgba(8,6,12,0.18)'); gr.addColorStop(0.92, 'rgba(8,6,12,0.62)'); gr.addColorStop(1, 'rgba(8,6,12,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 2);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; const sh = new THREE.Mesh(new THREE.PlaneGeometry(R * 1.2, H), new THREE.MeshBasicMaterial({ map: tx, transparent: true, depthWrite: false })); sh.position.set(WX + R * 0.6, 0, R * 1.3); sh.renderOrder = 6; scene.add(sh); }
// dust boiling up the wall's edge: puffs rising a whole tile per loop, drawn twice so they carry across the seam
const dustMats = [0x6e685c, 0x837b6c, 0x968d7c].map((c) => new THREE.MeshLambertMaterial({ color: c, transparent: true, opacity: 0.4, depthWrite: false })); const puffGeo = new THREE.IcosahedronGeometry(1, 1);
const dust = []; for (let i = 0; i < 34; i++) { const s = 22 + Math.random() * 46; const m1 = new THREE.Mesh(puffGeo, dustMats[i % 3]), m2 = new THREE.Mesh(puffGeo, dustMats[i % 3]); for (const m of [m1, m2]) { m.scale.set(s * 1.4, s, s); m.renderOrder = 7; scene.add(m); } dust.push({ m1, m2, y0: i / 34 + Math.random() * 0.02, a: Math.random() * TAU, x0: R * (0.96 + Math.random() * 0.14) }); }
// debris
const mat = (c) => new THREE.MeshLambertMaterial({ color: c }); const box = new THREE.BoxGeometry(1, 1, 1);
const kinds = [
  () => { const c = makeCar(0xc23b3b); c.scale.setScalar(50); return c; },
  () => { const c = makeCharacter('worker', {}); c.scale.setScalar(34); return c; },
  () => { const m = new THREE.Mesh(box, mat(0x7a5a3a)); m.scale.set(124, 11, 20); return m; },
  () => { const g = new THREE.Group(); const a = new THREE.Mesh(box, mat(0xb8473a)); a.scale.set(76, 54, 54); g.add(a); const r = new THREE.Mesh(new THREE.ConeGeometry(58, 38, 4), mat(0x3a3a44)); r.position.y = 46; r.rotation.y = Math.PI / 4; g.add(r); return g; },
  () => { const c = makeCar(0x4f8fd6); c.scale.setScalar(44); return c; },
  () => { const c = makeCharacter('pink', {}); c.scale.setScalar(32); return c; },
  () => { const m = new THREE.Mesh(box, mat(0x5a6a7c)); m.scale.set(66, 44, 32); return m; },
  () => { const m = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 40, 12), mat(0x2a3a40)); return m; },
  () => { const c = makeCar(0xe8d54a); c.scale.setScalar(42); return c; },
  () => { const m = new THREE.Mesh(box, mat(0x8a6a44)); m.scale.set(92, 9, 16); return m; },
  () => { const c = makeCharacter('suit', {}); c.scale.setScalar(32); return c; },
  () => { const g = new THREE.Group(); const t = new THREE.Mesh(new THREE.CylinderGeometry(6, 8, 58, 6), mat(0x4a3324)); g.add(t); const l = new THREE.Mesh(new THREE.IcosahedronGeometry(32, 0), mat(0x2f7a3f)); l.position.y = 42; g.add(l); return g; },
];
const pieces = []; const N = 16;
for (let i = 0; i < N; i++) { const o = kinds[i % kinds.length](); const o2 = o.clone(); scene.add(o, o2); pieces.push({ o, o2, ph: i / N, y0: -H / 2 + Math.random() * H, arc: 60 + Math.random() * 200, drop: 40 + Math.random() * 300, spin: [1 + (i % 3), (i % 2) ? -1 : 1, 2 - (i % 2)] }); }
const orbit = []; for (let i = 0; i < 22; i++) { const m = new THREE.Mesh(box, mat([0x3a2e24, 0x5a4a3a, 0x2a2a2e, 0x7a6a58][i % 4])); const s = 9 + Math.random() * 16; m.scale.set(s * 2.2, s * 0.6, s); scene.add(m); orbit.push({ m, a: Math.random() * TAU, y: -H / 2 + 40 + Math.random() * (H - 80), k: 1 + (i % 2), r: R * (1.02 + Math.random() * 0.2), sp: [1 + (i % 3), 1, 2] }); }
// rain, both sides; each streak is drawn twice (one tile apart) so it carries across the seam
const rainN = Math.round(240 * RAIN), rain = []; const rainPos = new Float32Array(rainN * 12); const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
scene.add(new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0x8a96a4, transparent: true, opacity: 0.35 })));
for (let i = 0; i < rainN; i++) rain.push({ x: (i % 2 ? 1 : -1) * (560 + Math.random() * 400), y0: Math.random(), k: 1 + (i % 2) });
const wrap = (y) => (((y + H / 2) % H) + H) % H - H / 2; const lerp = (a, b, k) => a + (b - a) * k;
window.renderAt = (t) => {
  const u = ((t / L) % 1 + 1) % 1;
  walls.forEach((w, i) => { w.material.map.offset.x = -u * (2 + i); w.material.map.offset.y = u * (i === 1 ? -1 : 1); });
  for (const p of pieces) { const s = (u + p.ph) % 1; const x = lerp(-600, 1250, s), y = wrap(p.y0 + Math.sin(Math.PI * s) * p.arc - s * p.drop); const show = Math.abs(x) > PAGE;
    for (const [o, yy] of [[p.o, y], [p.o2, y + (y > 0 ? -H : H)]]) { o.position.set(x, yy, 100); o.rotation.set(TAU * u * p.spin[0], TAU * u * p.spin[1], TAU * u * p.spin[2]); o.visible = show; } }
  for (const d of dust) { const y = wrap(-H / 2 + ((d.y0 + u) % 1) * H), x = WX + d.x0 + Math.sin(d.a + TAU * u) * 26; d.m1.position.set(x, y, R * 1.2); d.m2.position.set(x, y + (y > 0 ? -H : H), R * 1.2); d.m1.rotation.y = d.m2.rotation.y = TAU * u; }
  for (const c of orbit) { const a = c.a + TAU * u * c.k; c.m.position.set(WX + Math.cos(a) * c.r, c.y, Math.sin(a) * c.r); c.m.rotation.set(TAU * u * c.sp[0], TAU * u * c.sp[1], TAU * u * c.sp[2]); }
  for (let i = 0; i < rainN; i++) { const r = rain[i]; const y = wrap(H / 2 - ((r.y0 + u * r.k) % 1) * H); for (const [j, yy] of [[0, y], [1, y + H]]) rainPos.set([r.x, yy, 200, r.x - 10, yy - 46, 200], i * 12 + j * 6); } rainGeo.attributes.position.needsUpdate = true;
  renderer.render(scene, cam);
};
window.renderAt(0); document.body.dataset.ready = '1';
</script></body></html>
