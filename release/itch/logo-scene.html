<!doctype html>
<html><head><meta charset="utf-8"><title>Logo scene</title>
<style>
  html, body { margin: 0; background: #0e0c18; overflow: hidden; }
  #wrap { position: relative; }
  canvas { display: block; }
  .t { position: absolute; left: 0; right: 0; text-align: center; font-family: system-ui, 'Segoe UI', sans-serif; pointer-events: none; }
  #kicker { font-weight: 800; letter-spacing: .5em; color: #c9a6ff; -webkit-text-stroke: 1px #120a1f; text-shadow: 0 2px 6px #000; }
  #title { font-weight: 900; letter-spacing: .03em; color: #7dff3a; -webkit-text-stroke: 3px #120a1f; paint-order: stroke fill; text-shadow: 0 0 18px #7dff3a99, 0 5px 0 #3a1a5a, 0 10px 24px #000; line-height: .95; }
  #modes { font-weight: 800; letter-spacing: .12em; color: #fff; text-shadow: 0 2px 6px #000, 0 0 10px #000; }
  #modes b { color: #7dff3a; } #modes i { font-style: normal; color: #c9a6ff; } #modes u { text-decoration: none; color: #9fd6ff; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 55%, #0006 100%); pointer-events: none; }
</style></head>
<body><div id="wrap"><canvas id="c"></canvas><div class="vig"></div>
<div class="t" id="kicker">DEAD CITY</div><div class="t" id="title">TORNADO ALLEY</div><div class="t" id="modes"><b>YOU</b> ARE THE <u>STORM</u></div></div>
<script type="module">
// A cinematic still for the itch logo, cover and banner: the game's own city under a storm, with a realistic tornado.
import * as THREE from 'three';
import { generateMaze, buildCity, mulberry32 } from '/src/city.js';
import { createTwisters } from '/src/tornado.js';
import { makeCharacter, animateWalk } from '/src/poster/characters.js';
const q = new URLSearchParams(location.search); const W = +q.get('w') || 768, H = +q.get('h') || 512, layout = q.get('layout') || 'logo';
const canvas = document.getElementById('c'); const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); renderer.setSize(W, H);
const scene = new THREE.Scene();
// storm sky: near-black overhead, a sickly green-grey band at the horizon
{ const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#07060c'); gr.addColorStop(0.45, '#1c1a26'); gr.addColorStop(0.72, '#3a4238'); gr.addColorStop(0.82, '#5a5a48'); gr.addColorStop(1, '#2a2832'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); scene.background = new THREE.CanvasTexture(c); }
scene.fog = new THREE.Fog(0x2c2c30, 18, 75);
const hemi = new THREE.HemisphereLight(0x9aa4b0, 0x2a2622, 1.25); scene.add(hemi); const sun = new THREE.DirectionalLight(0xc8d0d8, 0.7); sun.position.set(-8, 12, 6); scene.add(sun);
const flashLight = new THREE.PointLight(0xcfe6ff, 0, 60); flashLight.position.set(6, 16, -6); scene.add(flashLight);
// the town
const rng = mulberry32(7); const cols = 17, rows = 17; const maze = generateMaze(cols, rows, 40, rng); for (let i = 1; i < cols - 1; i++) { maze[8][i] = false; maze[i][8] = false; } maze.avenues = { row: 8, col: 8 };
const city = buildCity(scene, maze, 6); city.detail.clouds.visible = false;
// the storm: big, grey-brown, debris-choked, dust boiling at the base
const tw = createTwisters(scene, { onBolt: () => { flashLight.intensity = 3; } });
const g = tw.make(true, []); g.scale.setScalar(layout === 'banner' ? 1.15 : 1.3); g.position.set(layout === 'strip' ? 19 : layout === 'banner' ? 10 : 1.5, 0, -12); scene.add(g);
const T = g.userData.twister;
[[0x4a4640, 0.94], [0x6e6860, 0.62], [0x8c8274, 0.42]].forEach(([c, o], i) => { const m = T.layers[i].material; m.color.setHex(c); m.opacity = o; });
T.cap.material.color.setHex(0x1c1c22); T.cap.material.opacity = 0.92; T.dust.material.color.setHex(0x6a5c4a); T.dust.material.opacity = 0.55;
for (let i = 0; i < T.junk.count; i++) T.junk.setColorAt(i, new THREE.Color([0x3a2e24, 0x5a4a3a, 0x2a2a2e, 0x7a6a58][i % 4])); T.junk.instanceColor.needsUpdate = true;
// a wall cloud: a low, wide, dark shelf around the funnel's top
{ const geo = new THREE.IcosahedronGeometry(1, 3); const shades = [0x1c1c24, 0x26262e, 0x30303a, 0x3c3c46].map((c) => new THREE.MeshLambertMaterial({ color: c, transparent: true, opacity: 0.55, depthWrite: false }));
  for (let i = 0; i < 90; i++) { const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 20; const m = shades[(Math.random() * shades.length) | 0]; const p = new THREE.Mesh(geo, m); p.position.set(g.position.x + Math.cos(a) * r, 12.5 + Math.random() * 3.5 - r * 0.04, g.position.z + Math.sin(a) * r * 0.7); p.scale.set(2.5 + Math.random() * 3.5, 0.9 + Math.random() * 0.9, 2 + Math.random() * 2.5); scene.add(p); } }
// rain curtain
{ const pts = []; for (let i = 0; i < 1600; i++) { const x = (Math.random() - 0.5) * 60, y = Math.random() * 18, z = -20 + Math.random() * 34; pts.push(x, y, z, x + 0.15, y - 0.9, z); } const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); scene.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0x8a92a0, transparent: true, opacity: 0.22 }))); }
// townsfolk running from the storm, down the street toward the camera
for (let i = 0; i < 6; i++) { const z = makeCharacter(['worker', 'pink', 'suit', 'hoodie', 'plaid', 'hivis'][i], {}); z.scale.setScalar(0.5); z.position.set(-1.8 + (i % 3) * 1.2 + Math.random() * 0.4, 0, 10.2 + Math.floor(i / 3) * 1.7 + Math.random() * 0.6); z.rotation.y = (Math.random() - 0.5) * 0.6; for (let k = 0; k < 3 + i; k++) animateWalk(z, 0.07, 1.8); scene.add(z); }
// camera: low and wide, looking up at the funnel over the rooftops
const strip = layout === 'strip'; // a thin banner: 960 x ~200
const cam = new THREE.PerspectiveCamera(strip ? 17 : layout === 'banner' ? 40 : 46, W / H, 0.1, 200);
cam.position.set(0.3, 2.4, 20.5); cam.lookAt(layout === 'banner' ? 4 : 0.8, 6.2, -10); if (strip) { cam.position.set(1, 3.2, 24); cam.lookAt(6.5, 5.6, -10); }
// settle the storm (debris and lights in place, a bolt or two), then draw
for (let i = 0; i < 90; i++) { tw.update(0.05); city.updateRain(0.05); }
flashLight.intensity = 2.2; renderer.render(scene, cam);
// text layout per format
const k = document.getElementById('kicker'), t = document.getElementById('title'), md = document.getElementById('modes');
const S = Math.min(W / 768, H / 512);
if (strip) { k.style.cssText += ';text-align:left;left:30px;top:' + (H * 0.1) + 'px;font-size:15px'; t.style.cssText += ';text-align:left;left:26px;top:' + (H * 0.22) + 'px;font-size:' + Math.round(H * 0.33) + 'px'; md.style.cssText += ';text-align:left;left:32px;top:' + (H * 0.64) + 'px;font-size:15px'; }
else if (layout === 'banner') { k.style.cssText += ';text-align:left;left:42px;top:' + (H * 0.2) + 'px;font-size:20px'; t.style.cssText += ';text-align:left;left:38px;top:' + (H * 0.27) + 'px;font-size:84px'; t.innerHTML = 'TORNADO<br>ALLEY'; md.style.cssText += ';text-align:left;left:44px;top:' + (H * 0.74) + 'px;font-size:19px'; }
else { k.style.top = (H * 0.05) + 'px'; k.style.fontSize = (20 * S) + 'px'; t.style.top = (H * 0.1) + 'px'; t.style.fontSize = (78 * S) + 'px'; md.style.bottom = (H * 0.05) + 'px'; md.style.fontSize = (20 * S) + 'px'; }
document.body.dataset.ready = '1';
</script></body></html>
