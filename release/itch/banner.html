<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: #120a1f; }
  #banner { width: 960px; height: 400px; position: relative; overflow: hidden; background: radial-gradient(circle at 30% 40%, #2a1449, #120a1f 70%); display: flex; align-items: center; }
  #banner img.logo { height: 400px; margin-left: 10px; }
  #banner .art { position: absolute; right: 18px; top: 50px; width: 420px; height: 300px; border-radius: 22px; border: 3px solid #7dff3a; box-shadow: 0 10px 30px #000a; overflow: hidden; }
  #banner .art object { width: 420px; height: 300px; }
</style></head>
<body><div id="banner"><img class="logo" src="logo-extraction-dead-city.png" alt=""><div class="art"><object data="/title.svg" type="image/svg+xml"></object></div></div></body></html>
