  <style>
    #ta { position: fixed; inset: 0; pointer-events: none; }
    #ta .top { position: absolute; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 6px 10px 0; text-shadow: 0 1px 3px #000; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-weight: 800; }
    #taScore { font-size: 22px; } #taCombo { color: #ffd24a; font-size: 16px; } #taTime { margin-left: auto; font-size: 18px; } #taRank { color: #7dff3a; font-size: 16px; }

    .poiChip.ready { border-color: #ffd24a; box-shadow: 0 0 8px #ffd24aaa; } .poiChip.ready b { background: #ffd24a; color: #1a0f2e; }

    .poiChip.done::before { content: ''; position: absolute; left: 1px; right: 1px; top: 50%; height: 3px; background: #ff4a3a; transform: rotate(-35deg); box-shadow: 0 0 2px #000; }

    .poiChip.boom { animation: poiBoom .8s ease-out; } @keyframes poiBoom { 0% { transform: scale(1); } 25% { transform: scale(1.9); box-shadow: 0 0 24px #7dff3a; } 100% { transform: scale(1); } }

    .poiArrow i { position: absolute; inset: -13px; display: flex; align-items: center; justify-content: flex-end; font-style: normal; font-size: 13px; color: #fff; text-shadow: 0 0 3px #000; }
    .poiArrow.ready { opacity: 1; } .poiArrow.ready em { border-color: #ffd24a; box-shadow: 0 0 10px #ffd24a; } .poiArrow.ready i { color: #ffd24a; }
    #taMap { position: absolute; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0)); width: 104px; height: 104px; border-radius: 50%; background: #0b1416c0; border: 2px solid #ffffff55; pointer-events: auto; touch-action: none; }
    #taGrow { position: absolute; left: 10px; right: 66px; top: calc(62px + env(safe-area-inset-top, 0)); height: 7px; background: #ffffff22; border-radius: 3px; }

    #taGrow .tick { position: absolute; top: -2px; width: 2px; height: 11px; background: #ffffffcc; transform: translateX(-1px); }

    #taGrow .tick.got b { color: #7dff3a; }
    /* pause: big, bright green with purple bars, so nobody has to hunt for it */
    #taPause { position: absolute; right: 10px; top: calc(48px + env(safe-area-inset-top, 0)); pointer-events: auto; width: 46px; height: 46px; padding: 0; margin: 0; border-radius: 12px; background: #7dff3a; border: 3px solid #5a2f80; color: #5a2f80; font-size: 20px; font-weight: 900; line-height: 1; box-shadow: 0 0 12px #7dff3a99, 0 4px 0 #3a1a5a; }
    #taPause:active { transform: translateY(2px); box-shadow: 0 0 8px #7dff3a99, 0 2px 0 #3a1a5a; }
    #taStick { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: #ffffff1a; border: 2px solid #ffffff55; transform: translate(-50%, -50%); display: none; }
    #taKnob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%; background: #c9a6ffcc; transform: translate(-50%, -50%); }
    #taBanner { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); text-align: center; line-height: 1.05; font-size: clamp(20px, 6vw, 40px); font-weight: 900; color: #ffd24a; text-shadow: 0 3px 0 #5a2f80, 0 6px 14px #000; white-space: normal; text-wrap: balance; opacity: 0; transition: opacity .2s; }
    .pop { position: fixed; left: 0; top: 0; font-weight: 900; font-size: 15px; color: #ffe27a; text-shadow: 0 2px 4px #000; pointer-events: none; white-space: nowrap; }
    #taStart .poi { font-size: 14px; max-width: 360px; }
    #taLevels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: min(92vw, 420px); }
    #taLevels .lvl { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; font-size: 10px; min-height: 58px; border-radius: 10px; }
    #taLevels .lvl b { font-size: 18px; } #taLevels .lvl i { font-style: normal; color: #ffd24a; font-size: 10px; }
    #taLevels .lvl.on { outline: 3px solid #7dff3a; } #taLevels .lvl:disabled { opacity: .45; }
    #taLevel { color: #c9a6ff; }
    .zoomBtn { position: absolute; right: 10px; width: 34px; height: 34px; padding: 0; font-size: 20px; line-height: 1; pointer-events: auto; }
    #taZoomIn { top: calc(104px + env(safe-area-inset-top, 0)); right: 16px; } #taZoomOut { top: calc(144px + env(safe-area-inset-top, 0)); right: 16px; }
    .chaserArrow { color: #fff; font-size: 24px; }
    .photoBar { position: fixed; left: 0; top: 0; width: 64px; height: 8px; border-radius: 4px; background: #000a; border: 1px solid #fff8; overflow: hidden; display: none; pointer-events: none; z-index: 4; } .photoBar i { display: block; height: 100%; width: 0; background: #ffffff; }
    #taTut { position: absolute; left: 50%; top: calc(126px + env(safe-area-inset-top, 0)); transform: translateX(-50%); width: min(360px, 92vw); padding: 10px 12px; border-radius: 14px; background: #1a0f2ef0; border: 2px solid #ffd24a; text-align: center; pointer-events: auto; box-shadow: 0 4px 16px #000a; transition: border-color .2s; }
    #taTut.hidden { display: none; } #taTut.ok { border-color: #7dff3a; } #taTut.ok b { color: #7dff3a; }
    #taTut b { display: block; font-size: 11px; letter-spacing: 1px; color: #ffd24a; } #taTut p { margin: 4px 0 6px; font-size: 15px; font-weight: 700; line-height: 1.3; color: #fff; }
    #taTut button { font-size: 11px; padding: 5px 10px; margin: 0; } #taTut button.hidden { display: none; }
    .howRow { display: flex; gap: 8px; justify-content: center; } .howRow button { margin: 0; }
    #taView { display: none !important; } /* the chase view is hidden for now */
    #taViewOld { position: absolute; right: 52px; top: calc(54px + env(safe-area-inset-top, 0)); pointer-events: auto; font-size: 11px; padding: 4px 8px; height: 26px; }
    #kjMega { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0)); transform: translateX(-50%); z-index: 6; padding: 6px 14px; border-radius: 12px; background: #2a1a04e8; border: 2px solid #ffd21a; color: #ffe27a; font-weight: 900; font-size: 14px; letter-spacing: 1px; text-shadow: 0 0 8px #ff8a1a; box-shadow: 0 0 18px #ffb02a; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); text-align: center; white-space: normal; animation: megaPulse .5s ease-in-out infinite alternate; }
    #kjMega.hidden { display: none; } @keyframes megaPulse { to { box-shadow: 0 0 30px #ffd21a; } }
    .megaArrow { color: #ffd21a; text-shadow: 0 0 10px #ff8a1a; }
    .planeArrow { position: fixed; left: 0; top: 0; font-size: 26px; color: #9fd6ff; text-shadow: 0 0 8px #000, 0 0 3px #2a6aa0; pointer-events: none; display: none; z-index: 4; }
    #taSeeded { position: absolute; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: #0a2a44cc; border: 2px solid #9fd6ff; color: #cfeaff; font-weight: 900; font-size: 15px; opacity: 0; transition: opacity .15s; }
    .bonusSkin { margin-top: 8px; padding: 8px 10px; border-radius: 10px; border: 2px solid #7dff3a; background: #0e2a0acc; color: #7dff3a; font-weight: 900; font-size: 15px; box-shadow: 0 0 14px #7dff3a66; } .bonusSkin small { color: #cfe8c8; font-weight: 700; font-size: 11px; }
    #taEnd table { margin: 0 auto; font-size: 15px; border-collapse: collapse; } #taEnd td { padding: 2px 8px; text-align: left; } #taEnd td:last-child { text-align: right; font-weight: 800; }
  
    /* ---------- Kaiju Madness extras ---------- */
    #taGrowFill { background: linear-gradient(90deg, #ff5a3a, #ffd24a 40%, #7dff3a); }
    #kjPower { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%); width: min(220px, 52vw); height: 22px; border-radius: 11px; background: #0b1416d0; border: 2px solid #ffffff44; overflow: hidden; }
    #kjPowerFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #3a8aff, #7af0ff); }
    #kjPowerTxt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; letter-spacing: .5px; color: #fff; text-shadow: 0 1px 2px #000; white-space: nowrap; }
    #kjPower.full { border-color: #7dff3a; box-shadow: 0 0 14px #7dff3a; animation: kjPulse .7s ease-in-out infinite alternate; } #kjPower.full #kjPowerFill { background: linear-gradient(90deg, #7dff3a, #d8ff6a); } #kjPower.full #kjPowerTxt { color: #1a0f2e; text-shadow: none; }
    @keyframes kjPulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.06); } }
    #kjRival { position: fixed; left: 0; top: 0; width: 120px; pointer-events: none; z-index: 4; text-align: center; }
    #kjRivalName { display: block; font-size: 10px; font-weight: 900; color: #ff8a7a; text-shadow: 0 1px 3px #000; white-space: nowrap; margin-bottom: 2px; }
    #kjRivalBar { height: 8px; border-radius: 4px; background: #000b; border: 1px solid #ff5a5a; overflow: hidden; } #kjRivalFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff3a3a, #ff9a3a); }
    .rivalArrow { width: 34px; height: 34px; font-size: 0; } .rivalArrow em { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 18px; border-radius: 50%; background: #2a0a0ac0; border: 2px solid #ff5a5a; } .rivalArrow i { position: absolute; inset: -13px; display: flex; align-items: center; justify-content: flex-end; font-style: normal; font-size: 13px; color: #ff5a5a; }
    #kjMini { position: fixed; inset: 0; z-index: 7; touch-action: none; }
    #kjMini.hidden { display: none; }
    #kjMini .panel { position: absolute; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%); width: min(340px, 90vw); padding: 10px 12px 14px; border-radius: 16px; background: #1a0f2ef0; border: 3px solid #ff7a3a; box-shadow: 0 0 20px #ff7a3a88; text-align: center; pointer-events: none; }
    #kjMini.m-roar .panel, #kjMini.m-spin .panel { border-color: #7dff3a; box-shadow: 0 0 20px #7dff3a88; }
    #kjMiniTitle { display: block; font-size: 16px; font-weight: 900; color: #ffd24a; margin-bottom: 8px; text-shadow: 0 2px 0 #3a1a5a; }
    #kjMiniSeq { display: flex; justify-content: center; gap: 8px; min-height: 0; margin-bottom: 6px; } #kjMiniSeq:empty { display: none; }
    #kjMiniSeq span { min-width: 40px; padding: 2px 6px; font-size: 26px; font-weight: 900; border-radius: 10px; background: #0b1416; border: 2px solid #ffffff33; color: #fff; opacity: .55; }
    #kjMiniSeq span.on { opacity: 1; border-color: #ffd24a; box-shadow: 0 0 10px #ffd24a; transform: scale(1.12); } #kjMiniSeq span.ok { opacity: 1; background: #1d5a18; border-color: #7dff3a; } #kjMiniSeq span.bad { opacity: 1; background: #5a1818; border-color: #ff3a3a; }
    #kjMini.m-dodge #kjMiniSeq span, #kjMini.m-dodge #kjMiniSeq span.on { font-size: 20px; min-width: 120px; }
    #kjMini .bar { position: relative; height: 22px; border-radius: 11px; overflow: hidden; background: #2a1a3a; border: 2px solid #ffffff55; }
    #kjMini.m-brawl .bar { background: linear-gradient(90deg, #ff3a3a, #3a1a2a 50%, #2a5a1a); }
    #kjMiniZone { position: absolute; top: 0; bottom: 0; background: #7dff3a; display: none; } #kjMini.m-roar #kjMiniZone { display: block; }
    #kjMiniMark { position: absolute; top: -3px; bottom: -3px; width: 8px; margin-left: -4px; left: 50%; background: #fff; border-radius: 4px; box-shadow: 0 0 8px #fff; }
    #kjMini .bar span { position: absolute; top: 2px; font-size: 10px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000; display: none; } #kjMini.m-brawl .bar span { display: block; } #kjMini .bar .me { right: 8px; } #kjMini .bar .them { left: 8px; }
    #kjMini::before, #kjMini::after { content: ''; position: absolute; top: 0; bottom: 0; width: 34%; pointer-events: none; opacity: 0; transition: opacity .1s; }
    #kjMini::before { left: 0; background: linear-gradient(90deg, #ff2a2acc, transparent); } #kjMini::after { right: 0; background: linear-gradient(270deg, #ff2a2acc, transparent); }
    #kjMini[data-side="L"]::before, #kjMini[data-side="R"]::after { opacity: 1; }
    .kjSpot { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle, #fff 0 18%, #ffd24a 22% 48%, #ff5a1a 52% 70%, transparent 72%); box-shadow: 0 0 18px #ffd24a; animation: spotIn .18s ease-out; }
    .kjSpot.pop { transform: scale(1.8); opacity: 0; transition: all .2s; } .kjSpot.miss { filter: grayscale(1); opacity: 0; transition: opacity .25s; }
    @keyframes spotIn { from { transform: scale(0.2); } to { transform: scale(1); } }
    /* monsters in two rows you swipe sideways, so the page never scrolls down */
    #kjPick { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); grid-auto-columns: 128px; gap: 8px; width: 100%; max-width: 100vw; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scroll-snap-type: x proximity; touch-action: pan-x; padding: 2px 12px 12px; box-sizing: border-box; } #kjPick .kjCard { scroll-snap-align: start; }
    
    #kjPickScr { gap: 10px; } #kjPickScr h1 { font-size: 28px; margin: 4px 0 0; }
    #kjPickDone { position: static; transform: none; margin-top: 4px; left: 50%; transform: translateX(-50%); z-index: 3; min-width: 180px; box-shadow: 0 4px 18px #000c; }
    .kjCard canvas { width: 100%; aspect-ratio: 1; border-radius: 8px; background: radial-gradient(circle at 50% 40%, #2e2450, #120a1f 75%); }
    .kjCard.locked canvas { filter: brightness(.18) saturate(0); }
    #kjChosen { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 16px; background: #1a0f2ecc; border: 2px solid #5a2f80; text-align: left; }
    #kjChosen canvas { width: 110px; height: 110px; border-radius: 12px; background: radial-gradient(circle at 50% 40%, #2e2450, #120a1f 75%); }
    #kjChosen > div { display: grid; gap: 4px; } #kjChosen small { color: #c9a6ff; font-size: 11px; letter-spacing: 2px; } #kjChosen b { color: #7dff3a; font-size: 18px; } #kjChosen span { color: #c9e8b8; font-size: 11px; max-width: 190px; }
    #kjChoose { margin: 4px 0 0; font-size: 14px; padding: 6px 12px; }
    #kjPickInfo { font-size: 12px; color: #c9e8b8; max-width: 420px; margin: 2px 0 0; } #kjPickInfo b { color: #7dff3a; } #kjPickInfo small { color: #c9a6ff; }
    .kjCard { display: grid; gap: 2px; padding: 6px 3px; margin: 0; text-align: center; min-height: 38px; align-items: center; border-radius: 12px; background: #1a0f2e; border: 2px solid #5a2f80; color: #fff; box-shadow: none; }
    .kjCard b { font-size: 11px; line-height: 1.15; color: #7dff3a; } .kjCard span { font-size: 9px; color: #c9e8b8; font-weight: 700; line-height: 1.25; }
    .kjCard.on { border-color: #7dff3a; box-shadow: 0 0 10px #7dff3a88; } .kjCard.locked { opacity: .5; } .kjCard.locked b { color: #aaa; }
    #taStart h1 { font-size: clamp(34px, 11vw, 56px); }
    .bonusSkin { margin-top: 8px; padding: 8px 10px; border-radius: 10px; border: 2px solid #7dff3a; background: #0e2a0acc; color: #7dff3a; font-weight: 900; font-size: 15px; box-shadow: 0 0 14px #7dff3a66; }
  </style>

<body class="booting">
  <canvas id="game"></canvas>
  <div id="ta" class="hidden">
    <div class="top"><span id="taScore">0</span><span id="taCombo"></span><span id="taRank">HATCHLING</span><span id="taTime">2:30</span>
      <div id="taSub"><span id="taLevel"></span><span id="taPct">0% destroyed</span><span id="taPeople">0 eaten</span><span id="taTargets"></span></div></div>
    <div id="taGrow"><div id="taGrowFill"></div><i class="tick" style="left:33.3%"><b>TITAN</b></i><i class="tick" style="left:66.6%"><b>COLOSSUS</b></i></div>

  <div id="taStart" class="screen">
    <p class="small" style="letter-spacing:4px;color:#c9a6ff;margin-bottom:-8px">DEAD CITY</p>
    <h1>KAIJU<br>MADNESS</h1>
    <p>You are the monster. Eat the town!</p>
    <div id="kjChosen"><canvas id="kjChosenCv" width="150" height="150"></canvas><div><small>YOUR MONSTER</small><b id="kjChosenName"></b><span id="kjChosenSpells"></span><button id="kjChoose" class="ghost">👹 CHOOSE MONSTER</button></div></div>

    <p class="small" id="taGoalLine"></p>
    <table id="taStats"></table>
    <button id="taAgain">GO AGAIN</button>
    <div class="howRow"><button id="taEndPick" class="ghost">CHANGE MONSTER</button><button class="ghost" onclick="location.href='store.html?from=kaiju'">🎨 SKIN SHOP</button><button class="ghost menuBtn" onclick="location.href='index.html'">MAIN MENU</button></div>
  </div>
  <script type="module" src="./src/kaiju/main.js"></script>
</body>
</html>
