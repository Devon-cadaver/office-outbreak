<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Skin Shop</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; touch-action: none; }
    #wrap { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 18px 12px 40px; }
    body { background: radial-gradient(circle at 50% 20%, #2a1449, #120a1f 70%); }
    #top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 10px; max-width: 520px; margin: 0 auto 10px; }
    #top .btns { display: flex; gap: 8px; width: 100%; } #top .btns button { flex: 1; margin: 0; }
    #top h1 { font-size: 26px; color: #7dff3a; text-shadow: 0 3px 0 #5a2f80; }
    #coins { color: #ffd24a; font-weight: 800; font-size: 18px; }
    #note { color: #c9a6ff; font-size: 13px; text-align: center; min-height: 18px; }
    #grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; max-width: 560px; margin: 0 auto; }
    @media (min-width: 700px) { #grid { grid-template-columns: repeat(4, 1fr); max-width: 760px; } }
    #grid h2 { grid-column: 1 / -1; color: #7dff3a; font-size: 15px; letter-spacing: 1px; margin-top: 10px; }
    .skin { display: grid; gap: 2px; padding: 5px; background: #1a0f2e; border: 2px solid #5a2f80; border-radius: 12px; color: #fff; text-align: left; box-shadow: none; }
    .skin canvas { width: 100%; aspect-ratio: 1; border-radius: 8px; background: #241540; }
    .skin b { font-size: 12px; line-height: 1.1; } .skin span { display: none; } .skin em { font-style: normal; color: #ffd24a; font-weight: 800; font-size: 11px; }
    .skin.on { border-color: #7dff3a; } .skin.on em { color: #7dff3a; } .skin.poor { opacity: .6; } .skin.plain { min-height: 60px; align-content: center; } .skin.plain span { display: block; font-size: 10px; opacity: .8; font-weight: 400; }
    .menuBtn { font-size: 13px; padding: 8px 14px; }
    #tabs { position: sticky; top: -18px; z-index: 5; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; max-width: 560px; margin: 0 auto 8px; padding: 8px 2px; background: #160c28f0; border-bottom: 1px solid #5a2f8088; scrollbar-width: none; }
    #tabs::-webkit-scrollbar { display: none; }
    #tabs button { min-width: 0; margin: 0; font-size: clamp(10px, 2.9vw, 13px); padding: 6px 2px; line-height: 1.15; border-radius: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #1a0f2e; border: 2px solid #5a2f80; color: #c9a6ff; box-shadow: none; }
    #tabs button.on { background: #7dff3a; border-color: #7dff3a; color: #120a1f; }
    #tabs button i { display: block; font-style: normal; opacity: .75; font-size: 10px; }
    #buyBox { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #0a0614cc; padding: 20px; }
    #buyBox.show { display: flex; }
    #buyBox .card { width: min(320px, 100%); background: #1a0f2e; border: 2px solid #7dff3a; border-radius: 16px; padding: 16px; text-align: center; color: #fff; box-shadow: 0 0 30px #7dff3a44; }
    #buyBox canvas { width: 120px; height: 120px; border-radius: 10px; background: #241540; }
    #buyBox h3 { margin: 8px 0 4px; font-size: 18px; color: #7dff3a; } #buyBox p { margin: 4px 0 12px; font-size: 13px; color: #c9a6ff; }
    #buyBox .row { display: flex; gap: 8px; } #buyBox .row button { flex: 1; margin: 0; white-space: nowrap; padding-left: 6px; padding-right: 6px; }
    #backBtn { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
  <div id="top"><h1>SKIN SHOP</h1><div id="coins">🪙 0</div><div class="btns"><button id="backBtn" class="ghost menuBtn">◀ BACK</button><button class="ghost menuBtn" onclick="location.href='index.html'">MAIN MENU</button></div></div>
  <p id="note">Clear towns and score points in Tornado Alley to earn coins.</p>
  <div id="tabs"></div>
  <div id="grid"></div>
  <p style="text-align:center;margin-top:16px"><button class="ghost menuBtn" onclick="location.href='index.html'">MAIN MENU</button></p>
  </div>
  <div id="buyBox"><div class="card"><canvas width="240" height="240"></canvas><h3 id="buyName"></h3><p id="buyText"></p><div class="row"><button id="buyNo" class="ghost">CANCEL</button><button id="buyYes">BUY</button></div></div></div>
  <script type="module" src="./src/store.js"></script>
</body>
</html>
