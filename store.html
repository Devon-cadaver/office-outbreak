<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Skin Shop</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    html, body { height: auto; overflow: auto; }
    body { background: radial-gradient(circle at 50% 20%, #2a1449, #120a1f 70%); padding: 18px 12px 40px; min-height: 100vh; }
    #top { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 520px; margin: 0 auto 10px; }
    #top h1 { font-size: 26px; color: #7dff3a; text-shadow: 0 3px 0 #5a2f80; }
    #coins { color: #ffd24a; font-weight: 800; font-size: 18px; }
    #note { color: #c9a6ff; font-size: 13px; text-align: center; min-height: 18px; }
    #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; margin: 0 auto; }
    #grid h2 { grid-column: 1 / -1; color: #7dff3a; font-size: 15px; letter-spacing: 1px; margin-top: 10px; }
    .skin { display: grid; gap: 4px; padding: 8px; background: #1a0f2e; border: 2px solid #5a2f80; border-radius: 12px; color: #fff; text-align: left; box-shadow: none; }
    .skin canvas { width: 100%; aspect-ratio: 1; border-radius: 8px; background: #241540; }
    .skin b { font-size: 14px; } .skin span { font-size: 11px; opacity: .8; font-weight: 400; } .skin em { font-style: normal; color: #ffd24a; font-weight: 800; font-size: 12px; }
    .skin.on { border-color: #7dff3a; } .skin.on em { color: #7dff3a; } .skin.poor { opacity: .6; } .skin.plain { min-height: 70px; align-content: center; }
  </style>
</head>
<body>
  <div id="top"><h1>SKIN SHOP</h1><div id="coins">🪙 0</div></div>
  <p id="note">Beat either game to earn a coin. Most skins cost one coin; the big rides cost two or three.</p>
  <div id="grid"></div>
  <p class="small" style="text-align:center;margin-top:16px"><a href="index.html" style="color:#c9a6ff">Back to main menu</a></p>
  <script type="module" src="./src/store.js"></script>
</body>
</html>
