<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tornado Time!" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="icon" href="./icon-192.png" />
  <title>Tornado Time!</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120a1f; overscroll-behavior: none; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #120a1f; }
  </style>
</head>
<body>
  <!-- the frame: the menu (with its opening scene), the games and the shop all load inside the iframe while the radio
       lives out here, so the music never stops between them. The first tap, on the menu's TAP TO PLAY, starts the sound -->
  <iframe id="app" title="Tornado Time!" allow="fullscreen; autoplay" allowfullscreen></iframe>
  <script type="module">
    import { frameRadio } from './src/audio.js';
    frameRadio();
    const app = document.getElementById('app');
    app.addEventListener('load', () => { try { app.contentWindow.focus(); } catch { /* ignore */ } });
    app.src = 'menu.html?intro=1' + (location.search.length > 1 ? '&' + location.search.slice(1) : '');
  </script>
</body>
</html>
