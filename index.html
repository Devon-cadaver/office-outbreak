<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Survive Dead City Extraction</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    body { background: radial-gradient(circle at 50% 30%, #2a1449, #120a1f 70%); }
    #menu { gap: 14px; }
    #menu h1 { font-size: clamp(34px, 9vw, 64px); }
    #menu .tag { color: #c9a6ff; font-size: 14px; margin-top: -6px; }
    .choice { width: min(88vw, 360px); text-align: left; padding: 14px 18px; display: grid; gap: 4px; border: 2px solid #7dff3a; background: #1a0f2e; color: #fff; border-radius: 14px; box-shadow: 0 6px 0 #3a1f5a; }
    .choice b { font-size: 20px; color: #7dff3a; letter-spacing: 1px; }
    .choice span { font-size: 13px; opacity: .85; font-weight: 400; }
    .choice .saved { color: #ffd24a; font-weight: 700; }
  </style>
</head>
<body>
  <div id="menu" class="screen">
    <h1>SURVIVE<br>DEAD CITY<br>EXTRACTION</h1>
    <p class="tag">Two ways to get out of town</p>
    <button class="choice" onclick="location.href='deadcity.html'"><b>SURVIVAL</b><span>Third-person joystick. Six nights, spells, guns, vehicles, survivors and a chopper at dawn.</span><span class="saved" id="dcSaved"></span></button>
    <button class="choice" onclick="location.href='zombieville.html'"><b>EXTRACT FROM ZOMBIEVILLE</b><span>Tap-to-route maze run. Lead the horde, rescue the crowds, make the chopper in ten districts.</span><span class="saved" id="zvSaved"></span></button>
    <p class="small"><a href="zombieville.html?build=1" style="color:#c9a6ff">Map builder (admin)</a></p>
  </div>
  <script>
    try { if (localStorage.getItem('oo_save_dc')) document.getElementById('dcSaved').textContent = 'Saved game: night ' + (JSON.parse(localStorage.getItem('oo_save_dc')).night + 1); } catch (e) {}
    try { if (localStorage.getItem('oo_save_zv')) document.getElementById('zvSaved').textContent = 'Saved game: district ' + JSON.parse(localStorage.getItem('oo_save_zv')).level; } catch (e) {}
  </script>
</body>
</html>
