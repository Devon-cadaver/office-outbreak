<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Survive Dead City Extraction</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    body { background: radial-gradient(circle at 50% 30%, #2a1449, #120a1f 70%); }
    #menu { gap: 14px; }
    #menu h1 { font-size: clamp(34px, 9vw, 64px); }
    #menu { overflow-y: auto; justify-content: flex-start; padding-top: 16px; }
    @media (max-height: 820px) { #titleArt { width: min(50vw, 280px) !important; } }
    #menu .tag { color: #c9a6ff; font-size: 14px; margin-top: -6px; }
    .choice { width: min(88vw, 360px); text-align: left; padding: 14px 18px; display: grid; gap: 4px; border: 2px solid #7dff3a; background: #1a0f2e; color: #fff; border-radius: 14px; box-shadow: 0 6px 0 #3a1f5a; }
    .choice b { font-size: 20px; color: #7dff3a; letter-spacing: 1px; }
    .choice span { font-size: 13px; opacity: .85; font-weight: 400; }
    .choice .saved { color: #ffd24a; font-weight: 700; }
  </style>
</head>
<body>
  <div id="menu" class="screen">
    <object id="titleArt" data="./title.svg" type="image/svg+xml" style="width:min(92vw,420px);aspect-ratio:420/300;border-radius:22px;box-shadow:0 10px 30px #000a;border:3px solid #7dff3a;pointer-events:none"></object>
    <p class="tag">Survive Dead City Extraction · three ways to get out of town</p>
    <button class="choice" onclick="location.href='deadcity.html'"><b>DEAD CITY (SURVIVAL)</b><span>Third-person joystick. Six nights, spells, guns, vehicles, survivors and a chopper at dawn.</span><span class="saved" id="dcSaved"></span></button>
    <button class="choice" onclick="location.href='zombieville.html'"><b>EXTRACT</b><span>Snake-style maze run. Gather a line of survivors and get them out by heli. Ten districts.</span><span class="saved" id="zvSaved"></span></button>
    <button class="choice" onclick="location.href='store.html'" style="border-color:#ffd24a;box-shadow:0 6px 0 #5a4a1a"><b style="color:#ffd24a">SKIN SHOP</b><span>Spend the coins you earn for beating a game on outfits for you, the survivors and your ride.</span><span class="saved" id="coins"></span></button>
    <button class="choice" onclick="location.href='tornado.html'" style="border-color:#c9a6ff;box-shadow:0 6px 0 #3a2a5a"><b style="color:#c9a6ff">🌪️ TORNADO ALLEY</b><span>Side game: you are the storm. Wreck the town, sweep up the people, grow three times bigger.</span></button>
    <p class="small"><a href="zombieville.html?build=1" style="color:#c9a6ff">Build your own map</a></p>
  </div>
  <script type="module">import { stampVersion } from './src/version.js'; stampVersion();</script>
  <script>
    try { if (localStorage.getItem('oo_save_dc')) document.getElementById('dcSaved').textContent = 'Saved game: night ' + (JSON.parse(localStorage.getItem('oo_save_dc')).night + 1); } catch (e) {}
    try { const c = Math.round(+JSON.parse(localStorage.getItem('oo_coins') || '0') * 100) / 100; document.getElementById('coins').textContent = c ? '🪙 ' + c + (c === 1 ? ' coin' : ' coins') : ''; } catch (e) {}
    try { if (localStorage.getItem('oo_save_zv')) document.getElementById('zvSaved').textContent = 'Saved game: district ' + JSON.parse(localStorage.getItem('oo_save_zv')).level; } catch (e) {}
  </script>
</body>
</html>
